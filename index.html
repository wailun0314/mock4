<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>IIQE 卷四 強積金中介人 模擬考試</title>
<style>
:root{
  --desk:#E4EAEE;
  --paper:#FFFFFF;
  --paper-2:#F2F5F8;
  --ink:#13284A;
  --ink-2:#42526A;
  --ink-3:#66758A;
  --rule:#C9D3DB;
  --rule-2:#E0E6EB;
  --mark-tint:#E6ECF6;
  --ok:#17734A;
  --ok-tint:#E2F2E8;
  --bad:#B3322A;
  --bad-tint:#FAE7E5;
  --warn:#94600E;
  --warn-tint:#FAEFD9;
  --focus:#2F6FED;
  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU","MingLiU","Source Han Serif TC",serif;
  --sans:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 0 rgba(19,40,74,.05),0 14px 32px -20px rgba(19,40,74,.45);
}
@media (prefers-color-scheme: dark){
  :root{
    --desk:#0F1722;
    --paper:#162232;
    --paper-2:#1C2B3F;
    --ink:#E6ECF4;
    --ink-2:#B3C0D0;
    --ink-3:#8796AA;
    --rule:#2E3F56;
    --rule-2:#24354B;
    --mark-tint:#233650;
    --ok:#4FC28C;
    --ok-tint:#12301F;
    --bad:#F2766B;
    --bad-tint:#3A1D1C;
    --warn:#E3AA4B;
    --warn-tint:#352812;
    --focus:#80A9FF;
    --shadow:0 1px 0 rgba(0,0,0,.35),0 14px 32px -18px rgba(0,0,0,.85);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 20px;min-height:56px}
.brand{margin-right:auto;font-family:var(--serif);font-weight:700;font-size:1.0625rem;white-space:nowrap}
.brand small{font-family:var(--sans);font-weight:400;font-size:.8125rem;color:var(--ink-3);margin-left:.6em}
.stat{font-size:.875rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9375rem;padding:4px 12px;border-radius:999px;background:var(--paper-2);border:1px solid var(--rule-2);white-space:nowrap}
.timer.low{color:var(--warn);background:var(--warn-tint);border-color:transparent}
.progress{height:4px;background:var(--rule-2)}
.progress>i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s ease}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);font-weight:600;font-size:.9375rem;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--paper-2)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);min-height:36px;padding:0 12px;font-size:.875rem;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}

main{max-width:1140px;margin:0 auto;padding:24px 20px 56px}

/* documents: start + result */
.doc{max-width:780px;margin:8px auto 0;background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:36px 40px 30px}
.doc-title{font-family:var(--serif);font-size:2rem;line-height:1.3;font-weight:700;margin:0 0 8px}
.doc-sub{color:var(--ink-2);margin:0 0 26px;max-width:40em}
.schedule{margin:0 0 22px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.schedule>div{display:grid;grid-template-columns:7em 1fr;gap:14px;padding:11px 2px;border-bottom:1px solid var(--rule-2)}
.schedule>div:last-child{border-bottom:0}
.schedule dt{color:var(--ink-3);font-size:.875rem;padding-top:2px}
.schedule dd{margin:0}
table{border-collapse:collapse;width:100%}
.weights td,.weights th{padding:5px 8px 5px 0;text-align:left;font-size:.9375rem;border-bottom:1px solid var(--rule-2);font-weight:400}
.weights tr:last-child td{border-bottom:0}
.weights th{color:var(--ink-3);font-size:.8125rem}
.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
.notice{margin:0 0 26px;padding:12px 16px;background:var(--warn-tint);border-left:3px solid var(--warn);border-radius:0 6px 6px 0;font-size:.9375rem;line-height:1.7}
.notice b{display:block;color:var(--warn);font-size:.875rem;margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.actions .grow{flex:1}
.hint{color:var(--ink-2);font-size:.875rem;font-variant-numeric:tabular-nums}
.fine{margin:22px 0 0;color:var(--ink-3);font-size:.8125rem;line-height:1.7}

/* exam layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:28px 34px 22px;min-width:0}
.q-head{display:flex;align-items:flex-start;gap:16px;padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--rule-2)}
.q-id{margin-right:auto;min-width:0}
.q-no{font-family:var(--serif);font-size:1.5rem;line-height:1.25;font-weight:700;margin:0}
.q-no:focus{outline:none}
.q-no:focus-visible{outline:3px solid var(--focus)}
.q-no span{font-family:var(--sans);font-size:.9375rem;font-weight:400;color:var(--ink-3);margin-left:.35em}
.q-meta{margin:4px 0 0;font-size:.8125rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 0}
.q-meta .topic{border-left:1px solid var(--rule);margin-left:10px;padding-left:10px}
.flag{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font-size:.8125rem;cursor:pointer;color:var(--ink-2)}
.flag:hover{background:var(--paper-2)}
.flag[aria-pressed="true"]{background:var(--warn-tint);border-color:var(--warn);color:var(--warn);font-weight:600}
.stem{font-family:var(--serif);font-size:1.125rem;line-height:1.85;margin:0 0 16px;max-width:44em}
.stmts{list-style:none;margin:0 0 20px;padding:10px 16px;background:var(--paper-2);border-left:3px solid var(--rule);border-radius:0 6px 6px 0;font-family:var(--serif);font-size:1.0625rem;line-height:1.75;max-width:46em}
.stmts li{display:grid;grid-template-columns:2.7em 1fr;gap:4px;padding:4px 0;align-items:baseline}
.stmts .n{font-family:var(--sans);font-size:.9375rem;color:var(--ink-3)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;margin:0;padding:12px 14px;text-align:left;font-size:1rem;line-height:1.6;background:var(--paper);border:1px solid var(--rule);border-radius:8px;cursor:pointer}
.opt:hover{background:var(--paper-2)}
.bubble{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink-3);background:var(--paper);color:var(--ink-2);font-weight:700;font-size:.875rem}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--mark-tint)}
.opt[aria-pressed="true"] .bubble{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt .tag{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--paper);white-space:nowrap}
.opt.r{cursor:default}
.opt.r:hover{background:var(--paper)}
.opt.ok,.opt.ok:hover{border-color:var(--ok);background:var(--ok-tint)}
.opt.ok .bubble{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.ok .tag{color:var(--ok)}
.opt.bad,.opt.bad:hover{border-color:var(--bad);background:var(--bad-tint)}
.opt.bad .bubble{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.bad .tag{color:var(--bad)}
.exp{margin-top:20px;padding-top:16px;border-top:1px dashed var(--rule)}
.verdict{margin:0 0 10px;font-weight:700;font-size:.9375rem}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.verdict.none{color:var(--warn)}
.exp h3{margin:0 0 4px;font-size:.875rem;font-weight:700;color:var(--ink-2)}
.exp .body{margin:0 0 14px;line-height:1.9;max-width:46em}
.ref{margin:0;display:flex;gap:12px;align-items:baseline;padding:9px 12px;background:var(--paper-2);border-radius:6px;font-size:.875rem;color:var(--ink-2)}
.ref b{flex:none;color:var(--ink);font-weight:700}
.pager{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule-2)}
.pager .grow{flex:1}
.pager .pos{font-size:.875rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sheet-btn{display:none!important}

/* answer card (OMR style) */
.omr{position:sticky;top:80px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.omr-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:var(--paper);font-family:var(--serif);font-weight:700}
.omr-head span{margin-left:auto;font-family:var(--sans);font-weight:400;font-size:.8125rem;opacity:.85;font-variant-numeric:tabular-nums}
.omr-close{display:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:6px;min-height:30px;padding:0 10px;font-family:var(--sans);font-size:.8125rem;cursor:pointer}
.omr-body{padding:12px 16px 14px;max-height:calc(100vh - 160px);overflow:auto}
.omr-group+.omr-group{margin-top:12px}
.omr-label{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--ink-3);margin-bottom:6px}
.omr-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cell{position:relative;aspect-ratio:1;width:100%;min-height:30px;margin:0;padding:0;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--ink-3);background:var(--paper);color:var(--ink-2);font-size:.75rem;font-variant-numeric:tabular-nums;cursor:pointer}
.cell:hover{background:var(--paper-2)}
.cell.done,.cell.done:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cell.ok,.cell.ok:hover{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.cell.bad,.cell.bad:hover{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.cell.skip{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.cell.cur{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--focus)}
.cell.flagged::after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:2px;background:var(--warn);border:1.5px solid var(--paper);transform:rotate(45deg)}
.cell.dim{opacity:.32}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;padding-top:10px;border-top:1px solid var(--rule-2);font-size:.75rem;color:var(--ink-3)}
.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border-radius:50%;border:1.5px solid var(--ink-3)}
.legend i.done{background:var(--ink);border-color:var(--ink)}
.legend i.ok{background:var(--ok);border-color:var(--ok)}
.legend i.bad{background:var(--bad);border-color:var(--bad)}
.legend i.skip{border-style:dashed;border-color:var(--warn)}
.legend i.fl{border-radius:2px;border:0;background:var(--warn);transform:rotate(45deg) scale(.8)}

/* result */
.result-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:center;padding-bottom:24px;margin-bottom:22px;border-bottom:1px solid var(--rule-2)}
.stamp{width:140px;height:140px;border-radius:50%;border:5px double currentColor;display:grid;align-content:center;justify-items:center;gap:4px;transform:rotate(-10deg);color:var(--ok);font-family:var(--serif);text-align:center}
.stamp.fail{color:var(--bad)}
.stamp .s-main{font-size:2.25rem;font-weight:900;line-height:1;letter-spacing:.06em}
.stamp.fail .s-main{font-size:1.75rem}
.stamp .s-date{font-family:var(--sans);font-size:.75rem;padding-top:4px;border-top:1px solid currentColor;font-variant-numeric:tabular-nums}
.stamp.animate{animation:stamp .55s cubic-bezier(.2,.9,.25,1) both}
@keyframes stamp{0%{opacity:0;transform:rotate(-10deg) scale(1.9)}55%{opacity:1;transform:rotate(-10deg) scale(.92)}100%{opacity:1;transform:rotate(-10deg) scale(1)}}
.res-title{margin:0;font-size:1.0625rem;font-weight:700;color:var(--ink-2)}
.res-title:focus{outline:none}
.score{margin:4px 0 0;font-family:var(--serif);font-weight:700;font-size:3.25rem;line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:1.375rem;font-weight:400;color:var(--ink-3);margin-left:.2em}
.score-line{margin:6px 0 0;color:var(--ink-2)}
.note{margin:10px 0 0;padding:6px 10px;display:inline-block;background:var(--warn-tint);color:var(--warn);border-radius:6px;font-size:.875rem;font-weight:600}
.breakdown{margin:0 0 24px}
.breakdown caption{text-align:left;font-weight:700;font-size:.9375rem;padding-bottom:6px}
.breakdown th,.breakdown td{padding:10px 8px;border-bottom:1px solid var(--rule-2);text-align:left;font-size:.9375rem;vertical-align:middle}
.breakdown thead th{font-size:.8125rem;color:var(--ink-3);font-weight:400;border-bottom:1px solid var(--rule)}
.breakdown tbody th{font-weight:600}
.breakdown tbody th small{display:block;font-weight:400;color:var(--ink-3);font-size:.75rem}
.breakdown .barcell{width:34%}
.bar{display:block;height:8px;border-radius:999px;background:var(--rule-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}

/* modal */
.modal-scrim{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(8,16,28,.5)}
.modal{width:100%;max-width:440px;background:var(--paper);border-radius:10px;padding:22px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal h2{margin:0 0 8px;font-family:var(--serif);font-size:1.25rem}
.modal p{margin:0;color:var(--ink-2);line-height:1.75}
.modal .actions{justify-content:flex-end;margin-top:18px}

@media (max-width:880px){
  main{padding:12px 10px calc(92px + env(safe-area-inset-bottom,0px))}
  .topbar-in{padding:8px 12px;gap:8px}
  .brand small,.stat{display:none}
  .layout{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:20px 16px 18px}
  .q-no{font-size:1.3125rem}
  .stem{font-size:1.0625rem}
  .stmts{font-size:1rem;padding:8px 12px}
  .opt{gap:12px;padding:11px 12px}
  .pager{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;background:var(--paper);border-top:1px solid var(--rule);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .pager .pos{display:none}
  .sheet-btn{display:inline-flex!important}
  .omr{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:14px 14px 0 0;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 -16px 40px rgba(0,0,0,.28);transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
  .omr.open{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
  .omr-close{display:inline-flex;align-items:center}
  .omr-body{max-height:none;flex:1}
  .omr-grid{grid-template-columns:repeat(8,minmax(0,1fr))}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(8,16,28,.45)}
  .doc{padding:24px 18px 22px;margin-top:0}
  .doc-title{font-size:1.5rem}
  .schedule>div{grid-template-columns:1fr;gap:2px}
  .result-top{grid-template-columns:1fr;justify-items:start;gap:18px}
  .stamp{width:118px;height:118px}
  .stamp .s-main{font-size:1.875rem}
  .stamp.fail .s-main{font-size:1.5rem}
  .score{font-size:2.75rem}
}
@media (max-width:420px){
  .omr-grid{grid-template-columns:repeat(7,minmax(0,1fr))}
  .opt{grid-template-columns:30px minmax(0,1fr)}
  .opt .tag{grid-column:2;justify-self:start}
  .bubble{width:28px;height:28px}
}
@media (prefers-reduced-motion:reduce){
  .stamp.animate{animation:none}
  .progress>i,.omr,.omr.open{transition:none}
}


/* paper 4 additions */
.weights td:first-child{white-space:nowrap}
.exp .stmts{margin:0 0 14px}
.exp h3 b{color:var(--ink)}
.stmts li{grid-template-columns:3em 1fr}
.omr-label span:first-child{min-width:0}
.omr-label span:last-child{white-space:nowrap}
.doc .notice{margin-top:0}
</style>
</head>
<body>
<header class="topbar" id="top"></header>
<div class="progress" id="progress" role="progressbar" aria-label="作答進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
<main id="view"><noscript><p>此模擬試卷需要啟用 JavaScript。</p></noscript></main>
<div id="modal-root"></div>
<div class="sr-only" aria-live="polite" id="live"></div>
<script>
(function(){

僱員爭取長遠資本增值"],"a":0},{"id":"3-7","ch":3,"ref":"手冊 3.1","q":"積金局採取多重措施，竭力保障強積金計劃下的資產，這些措施統稱“安全網\"，而以下那一項不是相關措施?","qi":[],"o":["有充裕資金運作","政府擔保","購有專業彌償保險","設立補償基金"],"a":1},{"id":"3-8","ch":3,"ref":"手冊 3.1","q":"以下哪項有關強積金守則及相關條例的描述是不正確?","qi":["證券及期貨事務監察委員會(證監會)及強制性公積金管理局(積金局)兩者均有發出相關守則","證監會批准成分基金","積金局是唯一審查披露資料的機構","積金局與證監會在規管職能方面互相補足"],"o":["I, II","I, III","II, III","III, IV"],"a":2},{"id":"3-9","ch":3,"ref":"手冊 3.1.1","q":"「強制性公積金計劃條例」及「強制性公積金計劃(一般)規例」為強積金計劃成員制定了多項統稱為「安全網」的規定，以下哪項並不是有關規定之一：","qi":[],"o":["受託人必須有充裕資金","必須購有專業彌償保險","個人受託人必須提供一份履行職能擔保","公司受託人必須繳付按金"],"a":3},{"id":"3-10","ch":3,"ref":"手冊 3.1.1","q":"以下哪項不是受託人及強積金計劃須遵守的嚴格認可規定？","qi":[],"o":["所有強積金受託人必須由證券及期貨事務監察委員會批核","所有強積金計劃必須獲得積金局註冊","受託人至少擁有$1.5億的繳足款股本及等額的淨資產","確保計劃的管限規則，法例得以遵從"],"a":0},{"id":"3-11","ch":3,"ref":"手冊 3.1.1、3.1.2及3.1.3","q":"強積金計劃對許多人的退休生活極為重要，當局為此竭力透過多層措施保障強積金計劃的資產，這些措施可統稱為「安全網」，這方面的措施包括：","qi":[],"o":["受託人和服務提供者，需經過嚴格的認可規定","購買專業彌償保險","設立補償基金","以上各項皆是"],"a":3},{"id":"3-12","ch":3,"ref":"手冊 3.1.1、3.5及5.1","q":"以下哪項最能形容香港的強積金制度？","qi":["海外退休計劃必須獲積金局核准或認可，而該名已是計劃成員的外籍僱員便可自動獲豁免參加強積金計劃。","所有受託人均須獲得積金局核准。","所有計劃均須符合嚴格的規定及向積金局註冊。","積金局負責認可強積金計劃。"],"o":["I, II","II, III","II, IV","I , III, IV"],"a":1},{"id":"3-13","ch":3,"ref":"手冊 3.1.1(a)、3.2(b)及5.6.1(a)","q":"以下何種人士／機構，必須符合最低的繳足款股本要求？","qi":[],"o":["受託人","保管人","投資經理","上述所有各項均正確"],"a":3},{"id":"3-14","ch":3,"ref":"手冊 3.1.1(a)及4.4","q":"強積金計劃的核准受託人之申請有嚴格規定，受託人需擁有多少資產？","qi":[],"o":["3,000萬的繳足股本","1.5億的繳足款股本及不相等額的淨資產值","1.5億的繳足款股款本及相等額的淨資產值","沒有規定"],"a":2},{"id":"3-15","ch":3,"ref":"手冊 3.1.1(a)(ii)、3.2(a)及3.2(b)","q":"以下哪些角色需要有嚴格的資本規定？","qi":[],"o":["受託人","投資經理","保管人","以上各項皆是"],"a":3},{"id":"3-16","ch":3,"ref":"手冊 3.1.1(b)及3.3","q":"以下哪類強制性公積金計劃有信託安排，並必須經強積金計劃管理局核准，才可設立？","qi":[],"o":["僱主營辦計劃","集成信託計劃","行業計劃","以上所有各項"],"a":3},{"id":"3-17","ch":3,"ref":"手冊 3.1.2","q":"下列哪種情況下需要「專業彌償保險」？","qi":["投資經理死亡","傳送期間遺失計劃資產","任何強積金計劃的損失導致無力償還債務","受託人的詐騙行為或疏忽過失"],"o":["I，II，III","II，III","II，IV","以上各項皆是"],"a":2},{"id":"3-18","ch":3,"ref":"手冊 3.1.2","q":"以下那項是保障強積金計劃資產的「安全網」?","qi":[],"o":["個人受託人須擁有至少HK$1.5億的繳足款股本","強積金計劃必須購有專業彌償保險","保障在日常業務過程中因計劃資金投資而導致的損失","計劃成員的失當行為或違法行為而造成的累算權益的損失"],"a":1},{"id":"3-19","ch":3,"ref":"手冊 3.1.2","q":"在強積金計劃的保障措施中，專業彌償保險是:","qi":[],"o":["比一般專業彌償保險的保障範圍更廣泛","比一般專業彌償保險的保障範圍更少","和一般專業彌償保險的保障範圍沒有分別","以上各項皆不是"],"a":0},{"id":"3-20","ch":3,"ref":"手冊 3.1.2","q":"在強積金計劃的保障措施中，以下哪項不包括於專業彌償保險範圍：","qi":[],"o":["賠償因某些訂明風險而可能蒙受的損失","賠償因某些訂明風險而可能蒙受欺詐及疏忽行為","較一般專業彌償保險提供更廣的保障","日常業務過程中因計劃資金投資而導致的損失"],"a":3},{"id":"3-21","ch":3,"ref":"手冊 3.1.2","q":"專業彌償保險賠償強積金計劃因某些訂明風險而可能蒙受的損失，以下哪項陳述是正確的？","qi":["受託人的欺詐行為","受託人的疏忽行為","計劃資產在運送途中遭受損失","較一般專業彌償保險的保障範圍更廣泛"],"o":["I、II","I、II、IV","II、III、IV","I、II、III、IV"],"a":3},{"id":"3-22","ch":3,"ref":"手冊 3.1.2","q":"強積金法例規定購買的專業彌償保險，可以說","qi":[],"o":["不是保險單","較其它相同類型保險提供的保障範圍沒有分別","比其它相同類型保險提供的保障範圍較廣泛","比其它相同類型保險提供的保障範圍較窄"],"a":2},{"id":"3-24","ch":3,"ref":"手冊 3.1.2","q":"專業彌償保險賠償強積金計劃因某些訂明風險而可能蒙受的損失，以下哪項陳述是正確的？","qi":[],"o":["只保障因欺詐而導致的損失","只保障因欺詐及疏忽而導致的損失","保障因欺詐，疏忽及若干指明之風險","所有風險，包括因計劃資金投資而導致的損失"],"a":2},{"id":"3-25","ch":3,"ref":"手冊 3.1.2及3.3","q":"強積金計劃共分三類， 以下哪項陳述是正確?","qi":[],"o":["集成信託計劃受著不同的監管及保障","行業計劃受著不同的監管及保障","三個計劃受著不同的監管及保障","強積金計劃必須購有專業彌償保險，以賠償強積金計劃因某些訂明風險而可能蒙受的損失。"],"a":3},{"id":"3-26","ch":3,"ref":"手冊 3.1.3","q":"以下哪項有關補償基金的描述是正確的？","qi":["補償基金的經費一部份來自政府的注資，其餘則來自徵費","所收取的計劃徵費，為計劃淨資產值的0.03%","所收取的計劃徵費與計劃收費相等，即計劃淨資產值的5%","為因服務提供者的失當行為或違法行為而蒙受損失的計劃成員作出補償"],"o":["I, II, III","I, II, IV","I, III, IV","II, III, IV"],"a":1},{"id":"3-27","ch":3,"ref":"手冊 3.1.3","q":"政府提供$6億作為補償基金的創辦基金，餘下資金則來自向強積金計劃收取相等於計劃淨資產值多少的徵費；","qi":[],"o":["0.03%","0.05%","0.08%","0.30%"],"a":0},{"id":"3-28","ch":3,"ref":"手冊 3.1.3","q":"補償基金可稱為?","qi":[],"o":["「安全保障」","「最後方法」","「安全網」","「信託」"],"a":1},{"id":"3-29","ch":3,"ref":"手冊 3.1.3","q":"補償基金是為補償強積金計劃成員因盡用彌償保險後而設的基金，其基金來源是:","qi":[],"o":["全數由政府注資","全數由強積金計劃成員支付","部份由政府注資，部份向強積金計劃徵收","由強積金服務提供者支付"],"a":2},{"id":"3-30","ch":3,"ref":"手冊 3.1.3(a)","q":"補償基金的費用首次來自政府注資，繼而向強積金計劃收取徴費。補償基金的目的，是為以下哪種情況下提供補償：","qi":[],"o":["受託人於投資基金時損失","計劃成員因服務提供者的失當行為而蒙受損失","計劃成員因健康問題而提早退休","因經濟蕭條令投資收益下降"],"a":1},{"id":"3-31","ch":3,"ref":"手冊 3.1.3(b)","q":"補償基金設立的目的是向因服務提供者的失當行為或違法行為而蒙受損失的計劃成員作出補償。政府提供創辦基金，餘下資金則來自徵費，徵費率為計劃淨資產值的：","qi":[],"o":["0.03%","0.30%","3%","0.05%"],"a":0},{"id":"3-32","ch":3,"ref":"手冊 3.1","q":"在強積金制度下，權益的可調動性是指：","qi":[],"o":["成員可隨時以現金形式提取","成員擁有全部的歸屬權益","僱員離職時可將其原計劃的累算權益轉移至另一計劃","所有投資以現金支付，方便攜帶"],"a":2},{"id":"3-33","ch":3,"ref":"手冊 3.1","q":"強積金條例指出權益的可調動性, 其真正意思是指 :","qi":[],"o":["可轉換戶口但嚴格規定累算權益必須保存至規定時間才可支付","可隨時現金提出","隨時自由提走","全數及立刻作為累算權益歸屬"],"a":0},{"id":"3-34","ch":3,"ref":"手冊 3.10.1","q":"下列那項是不正確描述實施「僱員自選安排」之後, 有關強積金計劃戶口行政安排?","qi":[],"o":["僱員透過「僱員自選安排」轉移現職僱員帳戶，僱主亦須就每個供款期在供款日或之前繼續向僱員所新選的強積金計劃作出供款。","「僱員自選安排」不會改變自願性供款現行安排。所產生的累算權益是否可以轉移，須視乎個別計劃的管限規則而定，","僱員亦可於不同日子把分帳戶內的累算權益分別轉移至不同的強積金計劃及強積金帳戶","以往受僱或自僱的強制性供款可隨時一筆過轉移至強積金個人帳戶或供款帳戶"],"a":0},{"id":"3-35","ch":3,"ref":"手冊 3.10.1","q":"以下哪項關於 ”僱員自選安排 ” 的 描述是正確？","qi":["僱員現職期 間的強制性供款，每個月可轉移一次。","供款賬戶中，以往受僱工作的 所有 強制性供款，每公曆年只能轉換一次。","僱員現職期間的僱主強制性供款部份，並不適用於 ”僱員自選安排 ”。","僱員現職期間的強制性供款，可一筆過轉移至指定個人賬戶。"],"o":["I, II","I , III, IV","III , IV","II ,III"],"a":2},{"id":"3-36","ch":3,"ref":"手冊 3.10.1","q":"以下哪項關於“僱員自選安排”是正確的？","qi":["僱員只可以選擇轉移現職期間的僱員強制性供款。","僱員可以選擇轉移現職期間僱主及僱員的強制性供款。","可分段轉移至不同強積金個人帳戶。","僱主仍須就每個供款期在供款日或之前繼續向僱主所選的現有強積金計劃作出供款。"],"o":["I, IV","II, III","II, IV","I, III, IV"],"a":0},{"id":"3-37","ch":3,"ref":"手冊 3.10.1","q":"以下哪項關於「僱員自選安排」 的描述是正確的？","qi":[],"o":["「僱員自選安排」不適用於職業退休計劃；","也可轉移供款帳戶內由自願性供款所產生的累算權益；","可要求將其僱員部分的累算權益定期自動轉移至新受託人的計劃內；","僱員作出轉移後， 需要等待12個月後才可以再次轉移。"],"a":0},{"id":"3-38","ch":3,"ref":"手冊 3.10.1","q":"以下哪項關於「僱員自選安排」是不對的？","qi":[],"o":["不會影響僱主處理抵銷遣散費或長期服務金的行政安排","僱員是不可轉移現職僱主的強制性供款所產生的累算權益的","轉移累算權益手續須經僱主安排","僱主繼續為新入職僱員登記加入僱主選擇的強積金計劃"],"a":2},{"id":"3-39","ch":3,"ref":"手冊 3.10.1","q":"在僱員自選安排實施後，僱員可把現職供款帳戶內部分累算權益，轉移至其自選強積金計劃內的指定帳戶。若認為新受託人未能切合所需，有關僱員可:","qi":[],"o":["每公曆年一次，一筆過轉移至其他強積金","根據計劃管限規則訂明不能再轉換","下一個年度相同月份","隨時轉換， 不受管限， 因為現戶口為個人帳戶"],"a":3},{"id":"3-40","ch":3,"ref":"手冊 3.10.1","q":"在僱員自選安排實施後，僱員可選擇將哪部分的強積金轉移至自選的強積 業計劃的陳述是正確的:","qi":["僱員於離職時不一定須要轉換計劃","飲食業及建造業的僱主必須強制性地安排僱員參加行業計劃","符合條件下之行業計劃成員在業內轉職時無須轉換計劃此項安排有助減低行政成本","僱主可安排「一般僱員」及「臨時僱員」同時參加行業計劃"],"o":["I, III","II, III","I, II, IV","I, III, IV"],"a":3},{"id":"3-164","ch":3,"ref":"手冊 3.3(c)","q":"哪一種強積金計劃是專為勞工流動性高的行業而設?","qi":[],"o":["行業計劃","集成信託計劃","僱主營辦計劃","流動性高計劃"],"a":0},{"id":"3-165","ch":3,"ref":"手冊 3.3(c)","q":"行業計劃主要適用於建造業和飲食業，這樣的安排原因是：","qi":["這些行業對香港的影響力比較大","這些行業的流動性比較高","可減低在轉移累算權益時所帶來的行政成本","這些行業的受僱人數比較多"],"o":["I, II","II, III","I, II, III","I, II, III, IV"],"a":1},{"id":"3-166","ch":3,"ref":"手冊 3.3(c)","q":"行業計劃的主要特色是：","qi":[],"o":["只適用於飲食業","參加此類計劃的成員純屬自願性質","如在同一行業內轉換僱主，可以無須轉換計劃","如在同一行業或不同行業內轉換僱主，就必須轉換計劃"],"a":2},{"id":"3-167","ch":3,"ref":"手冊 3.4","q":"一個在香港註冊登記的自僱人士在大陸開公司謀生，以下哪兩項需要參加強積金計劃：","qi":["該自僱人士本身","該自僱人士在香港聘請的秘書","該自僱人士在大陸聘請的工人","該自僱人士在大陸聘請的秘書"],"o":["I, II","I, III","II, III","III, IV"],"a":0},{"id":"3-168","ch":3,"ref":"手冊 3.4","q":"以下哪些人士屬於行業計劃中涵蓋範圍？","qi":["涼茶店員工","持有水務署簽發的水務匠牌照持有人","獲消防署註冊的消防裝置承辦商","學校工友"],"o":["I, II","II, III","I, II, III","I, II, III, IV"],"a":2},{"id":"3-169","ch":3,"ref":"手冊 3.4","q":"以下哪項屬於強積金制度下的飲食業？","qi":["燒味或鹵味店","大型連鎖店","凍房","自僱持牌小販"],"o":["II","I & III","III & IV","I, III & IV"],"a":1},{"id":"3-170","ch":3,"ref":"手冊 3.4","q":"以下那一類別不包括在建造業的涵蓋範圍內？","qi":[],"o":["持有水務署簽發的水務匠牌照持有人","一般樓宇結構工程","新鮮糧食店","室內裝飾工程"],"a":2},{"id":"3-171","ch":3,"ref":"手冊 3.4","q":"強積金制度所涵蓋僱員(獲豁免人士除外)包括:","qi":[],"o":["飲食業及建造業的臨時僱員;","受僱不少於60公曆日的僱員;","巳簽訂僱傭合約的僱員;","以上皆是 ;"],"a":3},{"id":"3-172","ch":3,"ref":"手冊 3.4、3.5及附錄III","q":"以下哪類人士需要涵蓋於強積金中：","qi":["涼茶舖的店員","獲水務署簽發牌的水務匠","獲自僱人士聘請的家務僱員","農民及漁民"],"o":["I, II, III","II, III, IV","I, II, IV","I, II, III, IV"],"a":2},{"id":"3-173","ch":3,"ref":"手冊 3.4及3.7","q":"強制性公積金計劃的基本目的為：","qi":["僱員或自僱人士均須參加強積金計劃","受僱人士，不論年齡，均須供款","僱員或自僱人士必須向計劃供款","僱主須為參加強積金計劃的僱員作出供款"],"o":["I, IV","II, III","II, III, IV","I, II, III, IV"],"a":0},{"id":"3-174","ch":3,"ref":"手冊 3.4及3.7","q":"臨時僱員的有關入息為$100，以下哪項是正確的:","qi":["臨時僱員指受僱於飲食業或建造業","僱員及僱主均就有關入息的5%供款","只須僱主供$10" 屬於 “有關入息”？","qi":["於合約內訂明的董事袍金","由僱主收取後再分發於僱員的小費","僱員從認股權証中投資獲利的金錢","僱主提供的免費午膳"],"o":["I, II, III","III, IV","II, III","I, II, III, IV"],"a":1},{"id":"3-401","ch":3,"ref":"手冊 附錄IV","q":"以下哪項屬於「有關入息」？","qi":[],"o":["流動電話服務費","現金津貼","非由僱主收取的小費","代通知金"],"a":1},{"id":"3-402","ch":3,"ref":"手冊 附錄IV","q":"就強積金計劃有關入息包括","qi":[],"o":["代通知金","股息收入","遣散費","項目佣金"],"a":3},{"id":"3-403","ch":3,"ref":"手冊 附錄IV.1–4","q":"以下哪項不是「有關入息」？","qi":["代通知金","由僱主收取的小費發放給僱員","行使該公司的股票期權的獲利收入","給僱員的免費膳食(非金錢利益)"],"o":["I, IV","II, III","III, IV","I, III, IV"],"a":3},{"id":"3-404","ch":3,"ref":"手冊 附錄V.2","q":"僱主及自僱人士可選擇受託人提供的不同方法／ 途徑支付強積金供款，以下那一個或多個是可接受的方法?","qi":["郵寄支票","直接扣帳","直接入帳","從僱主帳戶扣除儲備以支付日後的供款"],"o":["I, II","I, III & IV","I, II & III","I, II, III & IV"],"a":3},{"id":"3-405","ch":3,"ref":"手冊 附錄V.2","q":"僱主每月需把「付款結算書」交予受託人，以下哪項不正確？","qi":[],"o":["應保存一份供款支票及「付款結算書」的副本作為紀錄；","僱主須在每月的10個工作天內，把已填妥的「付款結算書」與供款一併交予受託人；","可以傳真方式遞交予受託人；","僱主可以分開支付供款及遞交「付款結算書」。"],"a":1},{"id":"4-4","ch":4,"ref":"手冊 4.1","q":"以下哪項有關受託人的描述並正確?","qi":[],"o":["由信託財產產生的所有收入， 應歸受託人所有","每項受託財產的指定受託人只可以一個","以受託人的利益行事","受託人可以是個人（自然人）， 也可以是法人（公司）"],"a":3},{"id":"4-5","ch":4,"ref":"手冊 4.1.1","q":"以下哪項有關受託人的描述是正確的？","qi":["受託人代受益人保管信託財產","受託人不是計劃資產的實益擁有人","受託人需要根據「信託契據」訂明的條文履行責任","受託人可以是個人，也可以是法人(公司)"],"o":["I, II, III","I, II, IV","II, III, IV","I, II, III, IV"],"a":3},{"id":"4-6","ch":4,"ref":"手冊 4.1.1","q":"信託概念的特點是：","qi":["受託人是財產註冊持有人","實益擁有人是受託人","受益人是以信託得到財產的所有收益","信託的所有責住均於信託契據中清楚訂明"],"o":["I, II, III","I, III, IV","II, III, IV","I, II, III, IV"],"a":1},{"id":"4-7","ch":4,"ref":"手冊 4.1.1","q":"信託的主要特點是：","qi":["受託人只是信託財產的註冊持有人， 而不是實益擁有人。","受託人只可以是個人（ 自然人）","每項信託財產的指定受託人可多於一個","在一般情況下，信託是根據通稱為「信託契據」的法律文件設立的"],"o":["I, II, III","I, II, IV","I, III, IV","II, III, IV"],"a":2},{"id":"4-8","ch":4,"ref":"手冊 4.1.1","q":"有關可能向受託人採取的行動，以下哪項陳述是正確的：","qi":["受託人未能履行職責即屬違反信託規定","受託人違反信託規定，可從信託基金中獲取賠償","受託人應負上對違反信託規定而令信託受損的有關責任","受託人就信託財產所產生的利潤，為受益人所有"],"o":["I, II, III","I, III, IV","I, II, IV","II, III, IV"],"a":1},{"id":"4-9","ch":4,"ref":"手冊 4.1.1(a)","q":"「信託」是指由受託人出任某項財產的：","qi":[],"o":["實益擁有人","註冊持有人","並無法律效力的持有人","服務提供者"],"a":1},{"id":"4-10","ch":4,"ref":"手冊 4.1.1(a)","q":"受託人就他所管理的信託而言：","qi":[],"o":["是實益擁有人","是註冊持有人","對該信託並無任何法律責任","不得就所提供的服務收取費用"],"a":1},{"id":"4-11","ch":4,"ref":"手冊 4.1.1(a)","q":"受託人的定義是:","qi":[],"o":["資產的註冊持有人","實益擁有人","發言人","受益人"],"a":0},{"id":"4-12","ch":4,"ref":"手冊 4.1.1(b)","q":"信託人指出任某項財產的註冊持有人，當中『財產』是指有關信託人的：","qi":[],"o":["現金","不動產(例如房地產)","不作另行投資的資產","計劃資產"],"a":3},{"id":"4-13","ch":4,"ref":"手冊 4.1.1(d)","q":"以下哪項有關受託人的描述是正確的？","qi":[],"o":["受託人是計劃資產的註冊持有人","受託人不是計劃資產的實益擁有人","受託人可以是個人權益擁有人(自然人)，也可以是法人公司","以上所列各項"],"a":3},{"id":"4-14","ch":4,"ref":"手冊 4.1.1(e)","q":"以下哪項關於信託的概念並不正確 ?","qi":[],"o":["信託的註冊人為受託人;","信託財產的實益擁有人為受託人;","受益人以信託人保管財產 ;","信託是根據稱為「信託契據」的法律文件設立;"],"a":1},{"id":"4-15","ch":4,"ref":"手冊 4.1.1(g)","q":"信託的受託人和受益人的所有責任、權力和權利均於哪項文件中清楚訂明？","qi":[],"o":["信託法例","信託契據","信託守則","信託職能擔保"],"a":1},{"id":"4-16","ch":4,"ref":"手冊 4.1.1(g)","q":"強積金計劃中的信託安排受到以下哪項條文規定？","qi":[],"o":["信託契據","信託條文","信託文件","信託規管條文"],"a":0},{"id":"4-17","ch":4,"ref":"手冊 4.1.1(i)","q":"受託人如違反信託契約內的條文，可稱之為：","qi":[],"o":["欺詐","失實陳述","違反信託","犯法"],"a":2},{"id":"4-18","ch":4,"ref":"手冊 4.1.2","q":"受託人具受信責任，這意味著受託人肩負重大的受託責任及可以信賴。以下哪項描述有關受託人的責任是正確的？","qi":[],"o":["必須竭力並謹慎地管理基金，確保基金獲穩妥保管","保存有關的賬目和紀錄供合資格的人士查閱","代表受益人保管信託財產，並須為受益人而非受託人的利益行事","以上所有各項"],"a":3},{"id":"4-19","ch":4,"ref":"手冊 4.1.2","q":"根據強制性公積金計劃條例，違反規例受託人判罰處分刊載於：","qi":[],"o":["僱傭條例","不同專業守則","強制性公積金計劃(一般)規例","強積金核准受託人合規標準"],"a":2},{"id":"4-20","ch":4,"ref":"手冊 4.1.2(a)","q":"受託人的基本信託法律責任是 :","qi":[],"o":["行使任何酌情權，須以受益人整體利益為依歸","行使任何酌情權，須以受託人利益依歸","行使任何酌情權，須以政府利益為依歸","行使任何酌情權，須以僱主利益為依歸"],"a":0},{"id":"4-21","ch":4,"ref":"手冊 4.1.3","q":"一般本來說，若受託人違反信託規定。以下哪些是對受託人行使的追索權的分類？","qi":["歸還","代位索償","問責性","彌償"],"o":["I, II","I, III","II, III, IV","I, II, III, IV"],"a":1},{"id":"4-22","ch":4,"ref":"手冊 4.1.3","q":"如受託人違反信託規定，就受託人追索權而言，以下哪項是不正確？","qi":["受託人無須用個人資金向受益人歸還信託財產","受益人有權對該受託人採取法律行動","受託人可利用強積金計劃資產來彌補其犯錯而導致的計劃資產損失","受託人無 (即香港以外的)公司受託人","個人(自然人)受託人"],"o":["I, II","I, III, IV","II, III, IV","III, IV"],"a":1},{"id":"4-36","ch":4,"ref":"手冊 4.2","q":"集成信託計劃由哪種受託人管理:","qi":[],"o":["可由公司受託人管理","只由公司受託人管理","可由個人受託人管理","只由個人受託人管理"],"a":1},{"id":"4-37","ch":4,"ref":"手冊 4.2","q":"集成信託計劃的受託人可以是下列哪項：","qi":[],"o":["本地公司受託人","可以由公司受託人或個人受託人擔任","個人（自然人）受託人","以上各項"],"a":0},{"id":"4-38","ch":4,"ref":"手冊 4.2","q":"在強積金的制度下，以下哪類不是受託人？","qi":[],"o":["本地公司受託人","政府委任的受託人","離岸公司受託人","個人受託人"],"a":1},{"id":"4-40","ch":4,"ref":"手冊 4.2","q":"受託人可分為：","qi":[],"o":["本地公司受託人","離岸公司受託人","個人受託人","以上所有各項"],"a":3},{"id":"4-41","ch":4,"ref":"手冊 4.2","q":"集成信託計劃的行政管理:","qi":[],"o":["可以是公司受託人","必須是公司受託人","可以個人（自然人）受託人","必須個人（自然人）受託人"],"a":1},{"id":"4-42","ch":4,"ref":"手冊 4.2","q":"受託人為集成信託計劃管理資產，受託人特點包括：","qi":["須由公司受託人管理","離岸公司受託人必須受到為積金局所接納的離岸監管當局監管","當地的信託法及公司法必須相當於香港在這方面的法律","離岸公司受託人必須符合額外的準則"],"o":["I, II","I, II, IV","I, III, IV","I, II, III, IV"],"a":3},{"id":"4-44","ch":4,"ref":"手冊 4.2","q":"以下哪項陳述關於集成信託計劃是不正確的？","qi":["必須由一個僱主所統籌","可以由公司受託人或個人受託人擔任","在香港有足夠規模和控制權","受託人的董事及行政總裁必須是「合適」人選"],"o":["I","I, II","I, II, III","I, II, III, IV"],"a":1},{"id":"4-45","ch":4,"ref":"手冊 4.2","q":"集成信託計劃是其中一種的強積金計劃種類，以下那些不是它的特點？","qi":["須由公司受託人管理","必須有兩個受託人","成員來自同一僱主或其有聯繫的公司","專為流動性高及習慣按日發薪的行業而設"],"o":["I, II, III","I, III, IV","II, III, IV","I, II, III, IV"],"a":2},{"id":"4-46","ch":4,"ref":"手冊 4.2","q":"關於受託人，下列哪一項是正確的？","qi":[],"o":["集成信托計劃可由公司受託人或個人受託人管理","行業計劃可由個人受託人管理","雇主管辦計劃可由公司受託人或個人受託人管理","上述全部各項"],"a":2},{"id":"4-47","ch":4,"ref":"手冊 4.3","q":"以下那項關於受託人的陳述不正確:","qi":[],"o":["保證計劃獲得註冊","確補備存充裕資本及專業彌償保險","受託人能在香港或以外的地方居住","謹慎、有技巧地、努力和審慎行事"],"a":2},{"id":"4-48","ch":4,"ref":"手冊 4.3","q":"核准的強積金計劃受託人，需具備下列哪項陳述要求：","qi":["專業彌償保險","謹慎、有技巧地審慎行事","確保計劃資產投資於不同投資項目","擁有至少HK$1億的繳足股本及等值淨資產"],"o":["I, II, III","I, II, IV","I, III, IV","I, II, III, IV"],"a":0},{"id":"4-49","ch":4,"ref":"手冊 4.3","q":"當局對受託人訂明一些最低要求，當中包括足夠技巧、知識、努力及審慎行事，該要求可稱為：","qi":[],"o":["審慎管理者原則","合理人士的規則","普通法中的謹慎責任","受託人的基本責任"],"a":3},{"id":"4-50","ch":4,"re  III, IV","I, II, III, IV"],"a":2},{"id":"5-268","ch":5,"ref":"手冊 附錄VIII.5","q":"以下哪項對於股票的描述為正確?","qi":[],"o":["投資股票目的是為了爭取較高資本增長","一般而言，股票的投資風險比貨幣市場工具及債券小","公司業績欠佳，其股價很可能下跌，因為公司會増加派息","買賣股票是低風險的操作"],"a":0},{"id":"5-269","ch":5,"ref":"手冊 附錄VIII.5","q":"以下哪類基金相對較高風險？","qi":[],"o":["股票基金","債券基金","混合資產基金","貨幣市場基金"],"a":0},{"id":"5-270","ch":5,"ref":"手冊 附錄VIII.5","q":"股票基金主要投資目標:","qi":[],"o":["令資本長期增長，從而取得高回報。","達到保本目標","取得低於債券的回報","取得跟銀行存款相若回報"],"a":0},{"id":"5-271","ch":5,"ref":"手冊 附錄VIII.5","q":"請以預期回報排列以下基金類別（由低至高）：（1）均衡基金（2）保守基金（3）股票基金（4）債劵基金","qi":[],"o":["(2) (1) (3) (4)","(2) (4) (1) (3)","(4) (1) (2) (3)","(4) (3) (1) (2)"],"a":1},{"id":"5-272","ch":5,"ref":"手冊 附錄VIII.5","q":"請將下列基金以波幅(由高至低)排列","qi":["股票基金","債券基金","混合資產基金","貨幣市場基金"],"o":["I, III, II, IV","II, III, I, IV","I, II, IV, III","I, III, IV, II"],"a":0},{"id":"5-273","ch":5,"ref":"手冊 附錄VIII.6","q":"如何計算基金中每單位的淨資產值?","qi":[],"o":["基礎投資項目的總市值＋ 現金 - 須付的行政及管理費用","基礎投資項目的總市值 - 須付的行政及管理費用","基礎投資項目的總市值＋現金 — 須付的行政及管理費用 ／已發行單位總數","基礎投資項目的總市值 – 須付的行政及管理費用／已發行單位總數"],"a":2},{"id":"5-274","ch":5,"ref":"2017年補充資料（預設投資策略）","q":"『預設投資策略』會隨計劃成員接近退休年齡而自動降低風險，以下描述正確的是？","qi":[],"o":["按成員生日日期自動降低投資風險，若2月29日生日就四年一次降低風險","當成員在18-49歲，100%強積金將會投資在「核心累積基金」","由60歲開始，成員的投資逐步由「核心累積基金」轉移至「65歲後基金」","直至成員55歲為止，成員的100%強積金將投資於「65歲後基金」"],"a":1},{"id":"5-275","ch":5,"ref":"2017年補充資料（預設投資策略）","q":"以下哪項是預設投資策略的描述錯誤的是。","qi":[],"o":["預設投資策略是由兩隻混合資產基金組成，即核心累積基金及65歲後基金","核心累積基金持有60%風險較高及40%風險較低的投資","65歲後基金則持有100%風險較低的投資","兩個基金則有收費上限管理費不得超過0.75%，經常性開支不得超過0.2%"],"a":2},{"id":"5-276","ch":5,"ref":"2017年補充資料（預設投資策略）","q":"以下有關『預設投資策略』的描述錯誤的是？","qi":[],"o":["由2017年4月1日起實施","強積金服務提供者持有現金, 不作任何投資","一個由兩個混合資產基金組成的投資方案","成員可主動選擇按照『預設投資策略』進行投資"],"a":1},{"id":"5-277","ch":5,"ref":"2017年補充資料（預設投資策略）","q":"以下那項是預設投資策略的特點是。","qi":["採納環球分散投資策略投資","隨計劃成員接近退休年齡而自動降低風險","設有收費上限","以上皆是"],"o":["I & II","III & IV","I, II & IV","以上皆正確"],"a":3},{"id":"5-278","ch":5,"ref":"2017年補充資料（預設投資策略）","q":"如客戶沒有作出任何投資選擇，以下選項正確的是？","qi":[],"o":["客戶有關供款將會根據保守基金作投資","客戶有關供款將會根 計劃"],"o":["I, II","I, II, III","I, II, IV","以上各項皆是"],"a":3},{"id":"6-61","ch":6,"ref":"手冊 6.4","q":"如職業退休計劃將被清盤，僱主有責任知會每名計劃成員及:","qi":[],"o":["保險業監理專員","職業退休計劃註冊處處長","證券及期貨事務監察委員會","以上各項"],"a":1},{"id":"6-62","ch":6,"ref":"手冊 6.4","q":"某現行公司的職業退休計劃，轉移至強積金計劃，過往職業退休計劃的供款，便成為補充供款。此計劃稱為：","qi":[],"o":["「增補」計劃","「凍結」計劃","「補充」計劃","「增加」計劃"],"a":0},{"id":"6-63","ch":6,"ref":"手冊 6.4","q":"僱主考慮是否繼續營運職業退休計劃時，以下那項最可能影響他的決定？","qi":[],"o":["退休保障安排","在強積金法例生效前的職業退休計劃","沒有強積金計劃令僱員成為成員","以上各項"],"a":0},{"id":"6-64","ch":6,"ref":"手冊 6.4(d)","q":"如僱主不會就將來的服務向職業退休計劃供款。現有成員可繼續累算 投資收益，直到他們有權根據計劃的管限規則收取益為止；即 該計劃應該以下列其中一種形式經營：","qi":[],"o":["「凍結」職業退休計劃","「結清」職業退休計劃","「增補」職業退休計劃","「暫緩」職業退休計劃"],"a":0},{"id":"6-66","ch":6,"ref":"手冊 6.4(c)","q":"以下哪項計劃作為補充供款用以增補強積金規定的最低權益？","qi":[],"o":["增加職業退休計劃","增補職業退休計劃","增進職業退休計劃","補充職業退休計劃"],"a":1},{"id":"6-68","ch":6,"ref":"手冊 6.4(c)","q":"某現行『退休保障計劃』的所有僱員參與『強制性公積金計劃』，亦保留現有的保障計劃，用以加強強積金以外的保障，此類計劃稱為：","qi":[],"o":["輔加計劃","強積金加強計劃","強積金輔助計劃","增補計劃"],"a":3},{"id":"6-69","ch":6,"ref":"手冊 6.4(c)","q":"現行的職業退休計劃將進行業務重整，為受僱僱員提供額外權益。此種稱為「增補」職業退休計劃，是指：","qi":[],"o":["計劃成員無須再作強制性供款","為計劃成員提供強積金權益以外的權益","計劃成員從計劃中得到的權益會從強積金權益中扣除","只接受新的僱員參加該計劃"],"a":1},{"id":"6-70","ch":6,"ref":"手冊 6.4(c)","q":"若僱主選擇「增補」計劃即是：","qi":[],"o":["新僱員及現有僱員留在職業退休計劃","新僱員及現有僱員參加強積金計劃","只有新僱員參加強積金計劃","只有現有僱員參加強積金計劃"],"a":1},{"id":"6-71","ch":6,"ref":"手冊 6.4(c)","q":"重組現行計劃以提供「增補」代表：","qi":[],"o":["提供僱員額外的利益","全部由僱主額外補貼","由強積金利益中扣除","受託人額外補貼"],"a":0},{"id":"6-72","ch":6,"ref":"手冊 6.5","q":"若新的僱員選擇參加獲強積金法例豁免的職業退休計劃，其「最低強積金利益」會：","qi":["受「保存、可調動性」規定所限制","在退休或合資格的情況下提取權益","轉職時不用將「最低強積金利益」轉到強積金計劃","被合理解僱時，受託人可沒收「最低強積金利益」"],"o":["I, II","I, IV","II, III","III, IV"],"a":0},{"id":"6-73","ch":6,"ref":"手冊 6.5","q":"當僱員準備選擇現存職業退休計劃或強積金計劃時，應考慮以下哪個事項？","qi":["清楚收入的不同定義的影響","服務的年期","所需供款的分别","對現有公司的去留取向"],"o":["I, II, III","I, III, IV","II, III, IV","以上各項皆是"],"a":3},{"id":"6-74","ch":6,"ref":"手冊 6.5","q":"若新的僱員選擇參加獲強積金法例豁免的職業退休計劃'其「最低強積金利益」會:","qi":["受「保存、可調動性」規定所限制","轉職時不用將「最低強積金利益」轉到強積金計劃","被合理解僱時，受託人可沒收 ch":7,"ref":"手冊 7.2.5(b)","q":"以下那項並非附屬中介人須在改變後七個工作日内，以書面將該項改變通知積金局:","qi":[],"o":["附屬中介入的姓名或名稱有所改變","附屬中介人的地址或任何聯络資料有所改變","取得任何作為乙類受規管者的資格","附屬中介人轉隸屬其他主事中介人"],"a":3},{"id":"7-81","ch":7,"ref":"手冊 7.2.5(b)","q":"附屬中介人出現下述哪些改變後, 須在七個工作日內，以書面將該項改變通知積金局：","qi":["附屬中介人的姓名或名稱有所改變","附屬中介人的地址或任何聯絡資料有所改變","附屬中介人不再是主事中介人的負責人員","附屬中介人取得任何作為乙類受規管者的資格"],"o":["I","II, III","I, II, III","I, II, III, IV"],"a":3},{"id":"7-82","ch":7,"ref":"手冊 7.2.5(b)","q":"附屬中介人除了下列那種不正確描述情況, 其他均需要在改變後七個工作日內，以書面將該項改變通知積金局：","qi":[],"o":["附屬中介人不再是主事中介人的負責人員","附屬中介人的姓名或名稱有所改變","附屬中介人的地址或任何聯絡資料有所改變","附屬中介人取得任何作為甲類受規管者的資格"],"a":3},{"id":"7-83","ch":7,"ref":"手冊 7.2.5(c)","q":"註冊中介人須就每段收費期（即每年）向積金局繳交年費。任何人如沒有按時繳交年費，積金局可:","qi":[],"o":["徵收附加費用，款額相等於未繳交的年費的5%","暫時撤銷該人的註冊","撤銷該人註冊為強積金中介人的資格","公開譴責該人"],"a":1},{"id":"7-84","ch":7,"ref":"手冊 7.2.5(e)","q":"積金局可指明身為附屬中介人的個人需要接受的訓練及需完成該訓練的限期，如積金局信納某名個人附屬中介人沒有在積金局指明的期限內完成指明的訓練，那麼：","qi":[],"o":["積金局可向該人發出書面通知,規定該人在14日內或在該通知指明的較長期間內完成該訓練。","積金局信納某名個人沒有遵從積金局發出的通知,可暫時撤銷該人作為附屬中介人的註冊。","積金局發出通知列明的要求後,積金局可撤銷該人作為附屬中介人的註冊。","積金局可暫時撤銷該人作為附屬中介人的註冊直至該附屬中介人重考並取得合格成績。"],"a":1},{"id":"7-85","ch":7,"ref":"手冊 7.2.6","q":"_______ 負責調查有關註冊強積金中介人的投訴。對於違規個案，_______ 全權決定是否作出紀律制裁。","qi":[],"o":["積金局，積金局","前線監督，積金局","積金局，前線監督","前線監督，前線監督"],"a":1},{"id":"7-86","ch":7,"ref":"手冊 7.2.6(b)","q":"如受規管者的前線監督有合理因由相信該受規管者可能沒有遵從其「作業要求」，該前線監督可委任調查員進行調查。調查員可藉書面要求某指明的人：","qi":[],"o":["交出是或可能攸關被調查的任何事宜的紀錄或文件，以及就該記錄或文件給予解釋或進一步詳情","到調查員席前或面前，回答關乎被調查的事宜的任何問題","回應關乎被調查的事宜的任何書面問題","上述各項"],"a":3},{"id":"7-87","ch":7,"ref":"手冊 7.2.6(b)","q":"如受規管者的前線監督有合理因由相信該受規管者可能沒有遵從某「作業要求」，該前線監督可指示調查員進行調查, 調查員可藉書面要求某指明的人。","qi":["交出是或可能攸關被調查的任何事宜的紀錄或文件，以及就該紀錄或文件給予解釋或進一步詳情；","到調查員席前或面前，回答關乎被調查的事宜的任何問題；","回應關乎被調查的事宜的任何書面問題；或","向調查員提供與調查有關連的任何協助。"],"o":["I","I & II","III & IV","以上皆是"],"a":3},{"id":"7-88","ch":7,"ref":"手冊 7.2.6(d)","q":"如積金局信納受規管者沒有遵從作業要求或受規管者被裁定犯（強積金條例）所訂定的罪行，則積金局可作出針對該受規管者的紀律制裁命令。如有關受規管者是註冊中介人，積金局可作出下列紀律制裁，除了：","qi":[],"o":["命令撤銷該人作為強積金註冊中介人的註冊","命令在一段積金局決定的期間內，暫時撤銷該人作為強積金註冊中介人的註冊","命令該人喪失註冊為強積金中介人的資格","命令該人繳付不超過$1,000,000的罰款"],"a":3},{"id":"7-89","ch":7,"ref":"手冊 7.2.7","q":"那個機構負責處理就積金局的若幹規管決定而提出的上訴？","qi":[],"o":["保險業監管局","證監會","金管局","強積金上訴委員會"],"a":3},{"id":"7-90","ch":7,"ref":"手冊 7.2(b)","q":"前線監督可委任調查員，藉書面要求某指明的受規管者:","qi":["交出是或可能攸關被調查的任何事宜的記錄或文件，以及就該記錄或文件給予解釋或進一步詳情","到調查員席前或面前，回答關乎被調查的事宜的任何問題","回應關乎被調查的事宜的任何書面問題","向調查員提供與調查有關連的任何協助"],"o":["I, II, III","I, II, IV","I, III, IV","I, II, III, IV"],"a":3},{"id":"7-91","ch":7,"ref":"手冊 7.3","q":"當積金局收到市民投訴中介人時：","qi":[],"o":["積金局會直接調查中介人","積金局會取消該中介人資格","積金局會轉介法院進行調查","積金局會轉到規管該中介人的前線監督調查及作出報告/處分"],"a":3},{"id":"7-92","ch":7,"ref":"手冊 7.3","q":"在針對處理對強積金中介人的投訴，以下哪項是對的","qi":[],"o":["積金局會接收涉及強積金銷售及推銷活動的投訴；","在收到投訴後，積金局會即時把投訴轉介予相關的前線監督；","前線監督會全權決定是否作出紀律制裁；","前線監督會全權決定是否作出檢控或罰款。"],"a":0},{"id":"7-93","ch":7,"ref":"手冊 7.4.1","q":"<註冊中介人操守要求指引>是根據《強積金條例》發出，旨在為《強積金條例》所涉及的人士作出指導，其目的包括：","qi":[],"o":["指引為受規管者，即從事與註冊計劃有關的銷售及推銷活動及提供該等計劃有關的意見人士","指導受規管者須遵守的最基本操守標準","闡釋在甚麼情況下，會信納受規管者己遵從或沒有遵從《強積金條例》","以上各項皆是"],"a":3},{"id":"7-94","ch":7,"ref":"手冊 7.5","q":"根據<註冊中介人操守要求指引>，規管強積金中介人的法定制度主要涵蓋以下範疇：","qi":["強積金中介人的註冊要求","前線監督的規管範圍","註冊中介人的操守要求","保障投資者"],"o":["I, III, IV","II, III, IV","I, II, III","I, II, IV"],"a":2},{"id":"7-95","ch":7,"ref":"手冊 7.5","q":"強積金中介人如失職或違犯所應遵守的規定，可遭受若干制裁及或懲罰，其中包括；","qi":[],"o":["由主事人施加的制裁","主事人不可施加制裁","可循民事起訴","可處罰款$2,000,000及監禁7年"],"a":0},{"id":"7-96","ch":7,"ref":"手冊 7.5","q":"向強積金中介人的制裁及罰則：","qi":[],"o":["只能立法施行","只能由主事人執行","可包括由主事人施行的紀律處分","不包括由主事人施行的紀律處分"],"a":2},{"id":"7-97","ch":7,"ref":"手冊 7.5","q":"在（證券及期貨條例〉中，任何人發放或持有明知具誤導成份的文件，最高懲罰:","qi":[],"o":["罰款","罰款及入獄","沒收佣金","民事起訴，並非刑事起訴"],"a":1},{"id":"7-98","ch":7,"ref":"手冊 7.5(a)","q":"強積金中介人如失職或違犯所應遵守的規定，主事中介人可施加的制裁包括：","qi":[],"o":["施行內部紀律處分","沒收佣金","譴責","以上皆是"],"a":3},{"id":"7-100","ch":7,"ref":"手冊 7.5(b)","q":"在<證券及期貨條例>中，如強積金中介人發放或持有明知具誤導成份的文件，最高懲罰：","qi":[],"o":["罰款","罰款及入獄","沒收佣金","可循民事起訴, 而非刑事起訴"],"a":1},{"id":"7-105","ch":7,"ref":"操守指引 III","q":"根據<註冊中介人操守要求指引>下，以下哪幾項是對於註冊中介人須具備的條件：","qi":["註冊中介人應時刻留意與強積金制度有關的發展","一般計劃運作事宜，例如與累算權益轉移及提取有關的事宜。","計劃內各個成分基金的投資政策、風險類別及水平，以及各項條件及條款","計劃的核准受託人及其服務提供者就計劃的營運或分銷提 供的服務範圍"],"o":["I, II, III","II, III, IV","I, III, IV","全部皆是"],"a":3},{"id":"7-106","ch":7,"ref":"操守指引 III.27","q":"根據<註冊中介人操守要求指引>下，為揀選某特定成分基金而進行適合性評估時，以下哪些是註冊中介人必須留意什麼狀況：","qi":["瞭解客戶的個人情況，例如客戶現時包括強積金組合(如有)在內的投資組合、年齡、預計退休年齡、財政狀況、 投資目標、投資知識、投資經驗、風險承受能力","向客戶解釋某一／某特定基金的原因;","向客戶配對其風險狀況及特定基金的風險水平，選擇合適的基金。","為客戶準備一份載有其風險狀況及所給予客戶解釋的文件，並要求客戶簽署，正本交由主事中介人保管7年。"],"o":["I, II, III","II, III, IV","I, III, IV","全部皆是"],"a":3},{"id":"7-107","ch":7,"ref":"操守指引 III.30","q":"根據<註冊中介人操守要求指引>下，主事中介人如無錄音系統，便須與核准受託人/ 保薦人/ 推銷商訂立安排，由其中一方的哪些人士致電該客戶。","qi":[],"o":["獲授權人士","指定人士","合資格人士","附屬中介人"],"a":0},{"id":"7-108","ch":7,"ref":"操守指引 III.18","q":"註冊中介人進行受規管活動時，如遇到需要特別照顧的客戶，須給予額外的照顧和支援。特別照顧的客戶是指:","qi":[],"o":["有關收入下限以內的人士","文盲人士","投資經驗少於10年的人士","以上皆是"],"a":1},{"id":"7-109","ch":7,"ref":"操守指引 III.4&III.5","q":"以下哪項不是<註冊中介人操守要求指引>中有關廣告及推銷資料的指引？","qi":[],"o":["必須確保其發出的任何廣告或推銷資料不可存有虛假、誤導或欺詐成分；","必須確保與註冊計劃及成分基金有關的資料清晰、公平及適時；","附屬中介人可派發其主事中介人核准的推銷資料或自行派發積金局資料；","必須確保適當披露註冊計劃及成分基金的風險。"],"a":2},{"id":"7-110","ch":7,"ref":"操守指引 II.I","q":"以下那項並非註冊中介人的操守要求?","qi":[],"o":["要清楚認識客戶性格","行事須誠實，公平，符合客戶的最佳利益及持正","須以按理可預期一個審慎的人在進行受規管活動時會有的謹慎，技巧和努力行事","勰保客戶的資產獲迅速妥善地入帳"],"a":0},{"id":"7-111","ch":7,"ref":"操守指引 II.I","q":"在註冊中介人的操守要求中，主事中介人在進行受規管活動時，必須:","qi":[],"o":["其行事須誠實、公平、符合客戶的最佳利益及持正；","須確保客戶的資產獲迅速妥善地入帳；","須以按理可預期一個審慎的人在進行受規管活動時會有的謹慎、技巧和努力行事；","以上所有皆是"],"a":3},{"id":"7-112","ch":7,"ref":"操守指引 III.19","q":"根據<註冊中介人操守要求指引>，若在評估後確定客戶需要特別照顧，註冊中介人在進行與作出重要決定有關的銷售及推銷程序時，須格外審慎，註冊中介人進行受規管活動時，可以為客戶提供以下選擇的機會︰","qi":["由一位朋友陪同並見證有關銷售及選擇成分基金的過程","安排多一名員工見證有關銷售及選擇成分基金的過程","在售後致電該名客戶以確認有關中介人已向客戶提供要約文件、解釋有關註冊計劃及成分基金的特點","將有關銷售及選擇成分基金的過程進行錄音"],"o":["I, II","I, II, III","II, III, IV","I, II, III, IV"],"a":1},{"id":"7-113","ch":7,"ref":"操守指引 III.19(b)","q":"根據<註冊中介人操守要求指引>，主事中介人如無錄音系統，須與 _______________訂立安排，由其中一方獲授權人士致電客戶","qi":[],"o":["附屬中介人","負責人員","積金局","核准受託人/保薦人/推銷商"],"a":3},{"id":"7-114","ch":7,"ref":"操守指引 III.23","q":"根據<註冊中介人操守要求指引>，主事中介人以確保其從事受規管活動的附屬中介人在進行受規管活動時，只可就該主事中介人或附屬中介人(視乎情況而定）勝任提供意見的事宜提供意見，主事中介人須提供足夠培訓，令附屬中介人︰","qi":["熟悉銷售程序及相關的管控措施","根據基金過往表現為客戶提供有關註冊計劃／ 成分基金的解釋、建議或意見","知悉需要遵守的相關法定及規管規定","具備足夠知識及技巧，為客戶提供有關註冊計劃／成分基金的解釋、建議或意見"],"o":["I, II","II, III","I, II, IV","I, III, IV"],"a":3},{"id":"7-115","ch":7,"ref":"操守指引 III.39","q":"註冊中介人在邀請／誘使客戶參加或轉移至某個註冊計劃，或就此向客戶提供意見時，須告知客戶假如不選擇任何成分基金，供款便會自動投資於該註冊計劃內的","qi":[],"o":["預設基金（現稱「預設投資策略 (DIS)」）","保守基金","建議基金","股票基金"],"a":0},{"id":"7-116","ch":7,"ref":"操守指引 III.40&41","q":"在 <註冊中介人操守要求指引>下， 註冊中介人若就投資表現提出意見，應該 :","qi":["把某成分基金與同類型成分基金在一段長時間(在可行情況下最少五年)內的表現加以比較","提醒客人過往的表現不能代表將來","不只著重過往的投資表現","比較強積金保守基金過往表現時要小心，因為若干強積金保守基金的定價機制未能反映費用的影響"],"o":["I, II","I, II, III","I, III","I, II, III, IV"],"a":3},{"id":"7-117","ch":7,"ref":"操守指引 III.6","q":"在<註冊中介人操守要求指引>下， 註冊中介人不可直接或間接向任何人士提供任何回佣， 禮物或優待( 包括但不限於佣金或其他金錢或非金錢形式的利益)， 以促使客戶就一個或以上註冊計劃/ 成分基金 :","qi":["成為成員;","作出供款;","轉移任何權益;","登記網上電子文件服務(現有客戶)"],"o":["I, II","I, II, III","I, III","I,II, III, IV"],"a":1},{"id":"7-118","ch":7,"ref":"操守指引 V.2III.4&III.5","q":"在<註冊中介人操守要求指引>下，主事中介人必須確保：","qi":["其附屬中介人行事須誠實、公平、符合客戶的最佳利益","其發出的任何廣告或推銷資料不可存有虛假、誤導或欺詐成分","與註冊計劃及成分基金有關的資料清晰、公平及適時","附屬中介人只可分發或派發其主事中介人核准的推銷資料"],"o":["I , II","II , III","I , III , IV","I , II , III , IV"],"a":3},{"id":"7-119","ch":7,"ref":"操守指引 VI.2.34ZM.b","q":"根據《註冊中介人操守要求指引》，____________需盡最大努力，確保___________遵從其設立的管控及程序。","qi":[],"o":["積金局，附屬中介人","主事中介人，附屬中介人","監管機構，註冊中介人","積金局，主事中介人"],"a":1},{"id":"7-120","ch":7,"ref":"操守指引 VI.2.II.30","q":"如出現風險錯配，則中介人將風險錯配的對話全程錄音，如有關過程沒有錄音，中介人便需作出跟進，下列哪項是錯誤的？","qi":[],"o":["要求客戶在售後作出書面確認","安排負責該項銷售的附屬中介人在售後致電客戶","售後七個工作天內致電客戶","有關客戶選擇的相關確認紀錄須由主事中介人保存最少七年"],"a":1},{"id":"7-121","ch":7,"ref":"操守指引 VI.2.III.14","q":"根據<註冊中介人操守要求指引>，中介人不需清楚了解以下哪項？","qi":[],"o":["市場上其他服務提供者的特惠收費安排","計劃及計劃內各個成分基金的費用及收費水平；","一般計劃運作事宜","計劃內各個成分基金的投資政策"],"a":0},{"id":"7-122","ch":7,"ref":"操守指引 VI.2.III.16","q":"<註冊中介人操守要求指引>中，關於備存紀錄的要求是：","qi":[],"o":["指令的紀錄須由主事中介人保存最少七年；","指令的紀錄須由主事中介人保存最少十年；","指令的紀錄須由主事中介人以及附屬中介人保存最少七年；","指令的紀錄須由主事中介人以及附屬中介人保存最少十年。"],"a":0},{"id":"7-123","ch":7,"ref":"操守指引 VI.2.III.19","q":"有需要時，何人負責在售後致電客戶？","qi":[],"o":["負責人員","主事中介人","附屬中介人","主事中介入授權的人士，而非進行該項受規管活動的附屬中介人"],"a":3},{"id":"7-124","ch":7,"ref":"操守指引 VI.2.III.19","q":"根據<註冊中介人操守要求指引>，中介人須格外審慎處理需要特別照顧的客戶，如在售後致電需要特別照顧的客戶：","qi":["須在售後七個工作天內進行","並須進行錄音","客戶的指示無須留待售後致電程序完成後才處理","安排多一名員工見證有關致電過程"],"o":["I, II","I, II, III","II, III, IV","I, II, III, IV"],"a":1},{"id":"7-125","ch":7,"ref":"操守指引 VI.2.III.19","q":"若在評估後確定客戶需要特別照顧，售後致電客戶的工作須由以下那人士進行︰","qi":[],"o":["主事中介人","受託人","由獲主事中介人授權的人士(而非進行該項受規活動的附屬中介人)","該客戶的附屬中介人"],"a":2},{"id":"7-126","ch":7,"ref":"操守指引 VI.2.III.19","q":"若在評估後確定客戶需要特別照顧，註冊中介人可:","qi":[],"o":["客戶在文件上簽署及附上醫生証明文件","於售後致電客戶確認或安排多一名員工見證有關銷售過程","客戶在文件上簽署便可","需再三確定客戶意願"],"a":1},{"id":"7-127","ch":7,"ref":"操守指引 VI.2.III.19","q":"若在評估後確定客戶需要特別照顧，註冊中介人在進行與作出重要決定有關的銷售及推銷程序時，須格外審慎；如有需要，更須為客戶提供額外支援。其中在售後致電該名客戶的工作須由獲________ 的人士在售後______個工作天內進行，並須進行錄音：","qi":[],"o":["主事中介人授權的人士 ，5","進行該項受規管活動的附屬中介人 ，5","主事中介人授權的人士，7","進行該項受規管活動的附屬中介人，7"],"a":2},{"id":"7-128","ch":7,"ref":"操守指引 VI.2.III.19及III.30","q":"根據<註冊中介人操守要求指引>，以下那種情況是需要進行錄音？","qi":["客戶的投資屬風險錯配","對需要特別照顧的客戶進行售後確認","對轉出保證基金的客戶進行售後確認","對客戶披露任何潛在的利益衝突"],"o":["I, II","II, III","I, II, III","I, III, IV"],"a":0},{"id":"7-129","ch":7,"ref":"操守指引 VI.2.III.27","q":"根據 <註冊中介人操守要求指引> ，為選擇某成份基金而做適合性評估，註冊中介人應該了解客戶的個人情況，以評估其風險承受能力，客人的個人情況包括","qi":["客戶的性別","客戶的投資經驗及知識","客戶的投資目標","客戶可接受的風險程度"],"o":["I, II","I, II, III","II, III, IV","I, II, III, IV"],"a":2},{"id":"7-130","ch":7,"ref":"操守指引 VI.2.III.27","q":"為揀選某特定成分基金而進行適合性評估時，註冊中介人須瞭解客戶的哪些個人情況：","qi":["預計退休年齡","風險承受能力","投資經驗","家庭狀況"],"o":["II, III","I, II, III","II, III, IV","I, II, III, IV"],"a":1},{"id":"7-131","ch":7,"ref":"操守指引 VI.2.III.27.d","q":"當需要為客人進行適合性評估時，註冊中介人須要完成以下哪項，除了：","qi":[],"o":["為客戶提供一份載有客戶風險狀況及所給予客戶的解釋的文件","簽署載有客戶風險狀況及所給予客戶的解釋的文件","已簽署的文件的副本只須由主事中介人及附屬中介人保存，","正本須由主事中介人保管最少七年。"],"a":2},{"id":"7-132","ch":7,"ref":"操守指引 VI.2.III.28","q":"如果註冊中介人未能從客戶取得用以評估客戶的風險狀況所需的資料，藉以完成所需的適合性評估，則註冊中介人：","qi":["應向客戶解釋未能妥善地評估客戶的風險狀況","不應邀請或誘使客戶考慮選擇某一特定成分基金","不應就某一特定成分基金向客戶提供任何受規管意見","於售後致電客戶確認或安排多一名員工見證有關銷售過程"],"o":["I, II","I, III","I, II, III","I, II, IV"],"a":2},{"id":"7-133","ch":7,"ref":"操守指引 VI.2.III.29","q":"客戶堅持在進行適合性性評估後發生風險錯配，註冊中介人必須：","qi":[],"o":["為風險錯配的談話内容予以錄音，作為日後審計線索","要求客戶在銷售當天之後作出咨面確認（如有關過程沒有錄咅）","安排獲授權人士在售後致電客戶（如有關過程沒有錄音）","以上各項皆是可行的"],"a":3},{"id":"7-134","ch":7,"ref":"操守指引 VI.2.III.29","q":"如果客戶在進行適合性評估以後，註冊中介人告知該名客戶該成分基金的選擇與客戶的風險狀況產生風險錯配，風險錯配是指：","qi":[],"o":["投資多隻基金於風險水平不同於經註冊中介人評估的客戶風險狀況的成分基金；","投資一隻基金投資於風險水平低於經註冊中介人評估的客戶風險狀況的成分基金；","堅持選擇把供款投資於風險水平高於經註冊中介人評估的客戶風險狀況的成分基金；","堅持選擇把供款投資於風險水平不同於經註冊中介人評估的客戶風險狀況的成分基金。"],"a":2},{"id":"7-135","ch":7,"ref":"操守指引 VI.2.III.30","q":"在<註冊中介人操守要求指引>下，如出現風險錯配，主事中介人須在售後 ______內致電客戶進行售後確認程序，並進行錄音。","qi":[],"o":["3個工作天","5個工作天","7個工作天","10個工作天"],"a":2},{"id":"7-136","ch":7,"ref":"操守指引 VI.2.III.34","q":"根據<註冊中介人操守要求指引>，附屬中介人與客戶首次接觸時，須：","qi":["出示印有其註冊為註冊中介人時所使用的姓名以及其強積金註冊編號的名片表明身分；","披露客戶可接受的回佣及禮物；","須向客戶清楚表明進行該次業務活動時是代表哪一個主事中介人行事；","披露其當時是以甚麼身分行事。"],"o":["I, III","I, II, III","I, III, IV","I, II, III, IV"],"a":2},{"id":"7-137","ch":7,"ref":"操守指引 VI.2.III.38.c","q":"註冊中介人向客戶提供有關保證基金資料時，須解釋以下哪項？","qi":["保證特點","保證人身分","保證有效期","保證人不履行保證所引致的風險"],"o":["I, IV","I, II, III","I, III, IV","I, II, III, IV"],"a":3},{"id":"7-138","ch":7,"ref":"操守指引 VI.2.III.4&III.5","q":"跟據《註冊中介人操守要求指引》要求，主事中介人必須確保:","qi":[],"o":["所有發出的任何廣告或銷售資料不可存有虛假、誤導或欺詐成分","附屬中介人只可分發或派發其主事中介人核准的推銷資料","附屬中介人只可分發或派發積金局核准的銷售資料","只有A及B"],"a":3},{"id":"7-139","ch":7,"ref":"操守指引 VI.2.III.40.41","q":"註冊中介人與客戶討論基金的過往表現時， 應向客戶解釋：","qi":[],"o":["保守基金的定價機制未能反映費用的影響；","可著重要基於過往投資表現而邀請或誘使客戶選擇某個註冊計劃；","把某成分基金的總投資表現與另一成分基金的總投資表現加以比較；","把風險水平、投資政策及投資目標不同的基金加以比較。"],"a":0},{"id":"7-140","ch":7,"ref":"操守指引 VI.2.III.44","q":"註冊中介人在邀請或誘使客戶根據僱員自選安排而轉移計劃或就此提供意見時， 必須向客戶提供：","qi":[],"o":["《僱員自選安排權益轉移指南》， 並須向客戶清楚解釋指南的內容；","轉移所涉及的步驟及處理轉移所需的時間；","「權益轉移程序流程圖」","以上皆是"],"a":3},{"id":"7-141","ch":7,"ref":"操守指引 VI.2.III.48","q":"註冊中介人邀請或誘使特定客戶轉移累算權益或就此提供意見時，須向該客戶瞭解該項縛移會否導致客戶從保證基金轉出累算權益。若該項轉移會導致客戶從保證基金轉出累算權益，以下那項並非註冊中介人須提及的內容？","qi":[],"o":["警告客戶從保證基金轉出累算權益，可能會因未能符合部分或全部的保證條件而導致喪失保證","把A項向客戶作出的警告及建議記錄在案，並要求客戶在文件上簽署以確認文件内容。上述文件的副本須交予客戶，正本則須由主事中介人保存最少七年","把對話錄音或售後致電客戶確認","註冊中介人應建議客戶先行查閱原來計劃的要約文件，或向其核准受託人查詢詳情後，才從保證基金轉出累算權益"],"a":2},{"id":"7-142","ch":7,"ref":"操守指引 VI.2.III.53","q":"如果中介人有重大利益，以致產生實際或潛在的利益衝突：","qi":[],"o":["中介人應拒絕這項交易","中介人應向客戶披露該項重大利益，確保客戶獲公平對待","中介人無須披露任何重大利益或衝突","以上各項皆不是"],"a":1},{"id":"7-143","ch":7,"ref":"操守指引 VI.2.III.53","q":"跟據《註冊中介人操守要求指引》，以下哪項關於主事中介人或隸屬某主事中介人的附屬中介人在進行受規管活動時有關利益衝突是正確的。","qi":["註冊中介人必須盡最大努力避免出現任何利益衝突","如果中介人有重大利益，須向客戶披露該項重大利益或衝突","採取一切合理步驟，確保客戶獲公平對待","不代表多於一個受託人進行受規管活動"],"o":["I, III","I, II, III","II, III, IV","I, II, III, IV"],"a":1},{"id":"7-144","ch":7,"ref":"操守指引 VI.2.III.56","q":"根據<註冊中介人操守要求指引>：","qi":[],"o":["註冊中介人不可以接受客戶以現金付款","如客戶要求註冊中介人把現金轉交註冊計劃的核准受託人，中介人應迅速處理","註冊中介人可以在見證人見證下接受客戶以現金付款","註冊中介人可以接受客戶以郵遞的現金付款"],"a":0},{"id":"7-145","ch":7,"ref":"操守指引 VI.2.III.6","q":"註冊中介人不可直接或間接向任何人士提供任何回佣以促使客戶：","qi":[],"o":["申請加入某強積金計劃","向某強積金計劃供款","將累算權益從某強積金計劃轉移至另一個強積金計劃","以上所有各項"],"a":3},{"id":"7-146","ch":7,"ref":"操守指引 VI.2.III.60","q":"某一特定主事中介人應實施哪些合適的管控措施及程序，取決於多個因素，包括其運作規模、隸屬的附屬中介人數目，以及其受規管活動的範圍及類別。然而，以下那項並非主事中介人最低限度須設有的管控措施：","qi":[],"o":["訂立程序及管控措施，確保主事中介人及其附屬中介人須在指明的時限內向積金局提交週年申報表","訂立安排、程序及管控措施，規定附屬中介人必須於七天內向主事中介人匯報所有屬於該附屬中介人的投訴","訂立程序及管控措施，確保附屬中介人遵守積金局指明的持續訓練要求","訂立安排以評估附屬中介人是否具備提供受規管意見的相關資格"],"a":1},{"id":"7-147","ch":7,"ref":"操守指引 VI.2.III.61","q":"主事中介人應為處理客戶投訴訂立妥善程序，以確保：","qi":["迅速及恰當地處理客戶的任何投訴，並盡快採取補救措施；","從速調查及回應投訴；","如不能以客戶滿意的方式從速解決問題，應立即通知積金局；","詳盡記錄所有投訴，以及每季向積金局提供投訴個案摘要。"],"o":["I, II","I, II, III","I, II, IV","I, II, III, IV"],"a":2},{"id":"7-148","ch":7,"ref":"操守指引 VI.2.III.7","q":"註冊中介人不可直接或間接向任何人士提供任何回佣 、禮物或優待，除非：","qi":["存入該受益人的強積金帳戶的紅利單位、紅利或回贈，作為費用及收費扣折；","在指定日期前繼續保留成員身分；","由註冊中介人就本身的費用及收費提供的折扣，而該折扣是從客戶應直接繳付的款項中扣除；","就以註冊中介人身分提供服務，向該註冊中介人繳付佣金或金錢／ 非金錢形式的利益。"],"o":["I, III","II, IV","I, III, IV","I, II, III, IV"],"a":2},{"id":"7-149","ch":7,"ref":"操守指引 VI.2,III23,III60(k)","q":"<註冊中介人操守要求指引>列明，主事中介人須提供足夠培訓予其附屬中介人，以下哪項是正確？","qi":["確保其從事受規管活動的附屬中介人熟悉銷售程序及相關的管控措施；","附屬中介人需具備足夠知識及技巧；","了解投資市場未來的狀況；","備存附屬中介人接受培訓的紀錄保存三年。"],"o":["I, II","I, II, III","I, II, IV","II, III, IV"],"a":2},{"id":"7-150","ch":7,"ref":"操守指引 III.12","q":"註冊中介人須概括瞭解強積金制度、產品及相關概念，包括：","qi":["市場上不同類別的註冊計劃及成分基金","基本的投資及相關概念,如風險與回報之間的關係","對未來市場經濟狀況作出建議","預測每一個成分基金的投資表現及回報"],"o":["I, II, III","I, II","II, III","I, II, IV"],"a":1},{"id":"7-151","ch":7,"ref":"操守指引 III.14","q":"根據<註冊中介人操守要求指引>，註冊中介人須對下列哪項有良好的認識？","qi":["當前的市場∕ 經濟狀況，以協助客戶作出投資決定","其推銷及∕ 或提供受規管意見的註冊計劃及成分基金","營運或分銷計劃的主要人士的身分（例如成分基金的核准受託人及投資經理）","計劃及計劃內各個成分基金的費用及收費水平"],"o":["I, II, III","I, II, IV","II, III, IV","I, II, III & IV"],"a":2},{"id":"7-152","ch":7,"ref":"操守指引 III.18","q":"根據<註冊中介人操守要求指引>，註冊中介人在進行受規管活動時，如遇到需要特別照顧的客戶，在進行與作出重要決定有關的銷售及推銷程序時，須給予額外的照顧和支援。以下哪些屬於特別照顧的客戶？","qi":["不能完全明白或也許不能完全明白所提供及討論的資料的人士","不能作出該重要決定或也許不能作出該重要決定的人士","教育水平較低（中五以下程度）的人士","因視障或有其他障礙而令其獨立作出有關重要決定的能力受到影響的人士"],"o":["I, II, III","I, II, IV","II, III, IV","I, III, IV"],"a":1},{"id":"7-153","ch":7,"ref":"操守指引 III.18","q":"根據<註冊中介人操守要求指引>，需要特別照顧的客戶是指不能完全明白或也許不能完全明白所提供及討論的資料的人士，或是指不能作出該重要決定或也許不能作出該重要決定的人士。以下哪類不屬於特別照顧的客戶？","qi":[],"o":["文盲人士","教育水平較低的人士","對投資知識水平較低的人士","因視障或有其他障礙而令其獨立作出有關重要決定的能力受到影響的人士"],"a":2},{"id":"7-154","ch":7,"ref":"操守指引 III.19(b)","q":"根據 <註冊中介人操守要求指引> 售後致電有需要特別照顧的客戶以進行確認的工作須由哪些人進行？","qi":[],"o":["進行受規管活動的附屬中介人","負責見證有關銷售過程的另一名員工","獲主事中介人授權的人士（而非進行該受規管活動的附屬中介人）","主事中介人的負責人員"],"a":2},{"id":"7-155","ch":7,"ref":"操守指引 III.19(b)","q":"註冊中介人對需要特別照顧的客戶須格外審慎。格外審慎的處理可包括在售後多少天內致電客戶作出確認？","qi":[],"o":["3個工作天","5個工作天","7個工作天","10個工作天"],"a":2},{"id":"7-156","ch":7,"ref":"操守指引 III.25/26","q":"根據<註冊中介人操守要求指引>，註冊中介人須在下列哪些情況下進行「適合性評估」以便顧及客戶的特定情況?","qi":["邀請或誘使僱員作出關乎某註冊計劃的選擇","向個人帳戶持有人提供有關從強制性制度提早提取累算權益的決定的詳細意見","向自僱人士提供有關作出自願性供款（如有）的款額的決定的詳細意見","邀請或誘使僱主把未來的自願性供款投資於某一特定成分基金"],"o":["II, III","III, IV","I, II, III","II, III, IV"],"a":2},{"id":"7-157","ch":7,"ref":"操守指引 III.27","q":"揀選某特定成分基金而進行適合性評估時，註冊中介人須：","qi":["瞭解客戶的個人情況，風險承受能力以及願意承受風險的程度","把客戶的風險狀況與成分基金的風險水平進行配對，揀選適合客戶的成分基金","向客戶解釋某一／某些特定成分基金適合該客戶的原因","為客戶提供一份載有客戶風險狀況及所給予客戶的解釋的文件，並要求客戶在該文件上簽署"],"o":["I, III","II, III","I, III, IV","I, II, III, IV"],"a":3},{"id":"7-158","ch":7,"ref":"操守指引 III.33","q":"附屬中介人如代表多於一名主事中介人行事，須：","qi":[],"o":["有第三者陪同作證人","向客戶清楚表明進行該次業務活動時是代表哪一個主事中介人行事","事後致電客人確認","作適合性評估"],"a":1},{"id":"7-159","ch":7,"ref":"操守指引 III.33","q":"根據<註冊中介人操守要求指引>，附屬中介人如代表多於一名主事中介人行事，須：","qi":[],"o":["避免在同一活動中代表多於一名主事中介人行事","安排多一名員工見證有關的銷售過程","向客戶清楚表明進行該次業務活動時是代表哪一個主事中介人行事","保存有關銷售過程的錄音紀錄，作為審計線索"],"a":2},{"id":"7-160","ch":7,"ref":"操守指引 III.35","q":"根據<註冊中介人操守要求指引>有關註冊中介人金錢或非金錢利益的規定，註冊中介人在邀請∕誘使∕ 提供意見時須向客戶述明：","qi":["註冊中介人獲得利益的詳情","註冊中介人會否就提供的服務向客戶直接收取費用,或會否就該邀請∕誘使∕提供意見以其他方式（例如佣金）獲得報酬","該陳述可以概括地披露主事中介人及∕或附屬中介人將會得到的金錢及非金錢利益的性質","註冊中介人將會得到的利益會否因應客戶對註冊計劃/成分基金的選擇而有差異"],"o":["I, II, III","I, II, IV","I, III, IV","II, III, IV"],"a":3},{"id":"7-161","ch":7,"ref":"操守指引 III.39","q":"註冊中介人在邀請∕誘使客戶參加或轉移至某個註冊計劃，或就此向客戶提供意見時，須告知客戶假如不選擇任何成分基金，供款便會自動投資於該註冊計劃內的 。","qi":[],"o":["保本基金","預設基金（現稱「預設投資策略 (DIS)」）","保守基金","停泊基金"],"a":1},{"id":"7-162","ch":7,"ref":"操守指引 III.40","q":"根據 <註冊中介人操守要求指引> 有關投資表現的資料的規定，註冊中介人：","qi":["應透過比較過往投資表現而就此建議客戶選擇成分基金","向客戶解釋過往表現不一定可作為未來表現的可靠指標","向客戶解釋比較強積金保守基金過往表現時尤其需要小心，因為若干強積金保守基金的定價機制未能反映費用的影響","不應只著重過往投資表現而邀請／誘使客戶選擇註冊計劃／成分基金，或就此提供意見"],"o":["I, II, III","I, III, IV","II, III, IV","I, II, III, IV"],"a":2},{"id":"7-163","ch":7,"ref":"操守指引 III.52","q":"根據<註冊中介人操守要求指引>，註冊中介人重點解釋並比較費用及收費時，須請客戶留意有關重要披露資料，例如：","qi":["周年利益報表","收費表","基金開支比率","持續成本列表"],"o":["I, II, III","II, III, IV","I, II, IV","I, II, III, IV"],"a":1},{"id":"7-164","ch":7,"ref":"操守指引 III.8.9.11","q":"根據<註冊中介人操守要求指引>註冊中介人應：","qi":["避免不當地使用在業務活動過程中所取得的個人資料","任何因受規管活動而引致的投訴由內部職員負責處理","註冊中介人必須把客戶所提供的全部資料視作機密資料， 除非在法例準許的情況下，否則不得披露或使用該等資料","註冊中介人進行與註冊計劃有關的銷售及推銷活動及提供有關的受規管意見時，其行事必須符合客戶的最佳利益"],"o":["I, II, III","I, II, IV","I, III, IV","II, III, IV"],"a":2},{"id":"7-165","ch":7,"ref":"操守指引 III.21-23","q":"在進行受規管活動時, 以下那一種情形主事中介人或附屬中介人屬違反條例?","qi":[],"o":["附屬中介人應就本身沒有足夠培訓的事宜或提供意見","主事中介人須作出安排，以評估其附屬中介人是否具備相關資歷、技巧及／或知識","主事中介人須提供足夠培訓，以確保其從事受規管活動的附屬中介人具備足夠知識及技巧，為客戶提供有關註冊計劃／成分基金的解釋、建議或意見","附屬中介人不應就本身欠缺需要具備的特定技巧和知識的事宜上提供意見"],"a":0},{"id":"7-166","ch":7,"ref":"操守指引 附錄III.19","q":"註冊中介人進行受規管活動時，如遇到需要特別照顧的客戶，在進行與作出重要決定有關的銷售及推銷程序時，須給予額外的照顧和支援，「格外審慎」的處理，其中包括:在售後致電客戶，以下哪項是正確在售後致電的描述?","qi":["致電客戶的工作須由獲主事中介人授權的人士，在售後七個工作天內進行，並須進行錄音","主事中介人如無錄音系統，須與核准受託人／保薦人／推銷商訂立安排，由其中一方的獲授權人士致電該客戶","在售後致電客戶的工作必須由同一位銷售強積金的附屬中介人來作，令整件事情一致性及關連性","在售後致電客戶的工作亦可由強積金附屬中介人的見證人來作，令整件事情更公平、更公正"],"o":["I, II","III, IV","II, III, IV","I, II, III, IV"],"a":0},{"id":"7-167","ch":7,"ref":"操守指引 I.1","q":"<註冊中介人操守要求指引>（簡稱「指引」）由積金局發出，其目的包括：","qi":[],"o":["為受規管者（即從事與註冊計劃有關的銷售及推銷活動及提供與該等計劃有關的意見的人士）所須遵守的最基本操守標準提供指導","闡釋「積金局」在甚麼情況下，會信納受規管者已遵從或沒有遵從各項作業要求","協助受規管者瞭解如何遵從各項作業要求","以上所有各項"],"a":3},{"id":"7-168","ch":7,"ref":"操守指引 III.50-51","q":"根據<註冊中介人操守要求指引>有關費用及收費的資料的規定，註冊中介人需","qi":["向客戶提供註冊計劃/成份基金的費用及收費的資料","告知客戶有關費用及收費優惠的條款及條件(如適用)","向客戶提供任何優惠及優待(如適用)的書面確認","強調費用及收費對潛在回報的長遠影響，並以例子說明"],"o":["I, II, III","I, II, IV","II, III, IV","I, II, III, IV"],"a":1},{"id":"7-169","ch":7,"ref":"操守指引 III.12.14.37","q":"根據<註冊中介人操守要求指引>，註冊中介人必須在下列哪項有良好的認識？","qi":["其推銷及/或提供受規管意見的註冊計劃/及成分基金","當前的市場/經濟狀況,以協助客戶作出投資決定","計劃及計劃內各個成分基金的費用及收費水平","市場內不同類別的註冊計劃及成分基金"],"o":["I, III","I, IV","II, IV","以上皆是"],"a":0},{"id":"7-170","ch":7,"ref":"操守指引 III.14","q":"註冊中介人須對其推銷及／或提供受規管意見的註冊計劃及成分基金具有良好的認識。註冊中介人須清楚瞭解：","qi":[],"o":["計劃及計劃內各個成分基金的費用及收費水平","一般計劃運作事宜，例如與累算權益轉移及提取有關的事宜","計劃內各個成分基金的投資政策、風險類別及水平，以及各項條件及條款","上述所有各項"],"a":3},{"id":"7-171","ch":7,"ref":"操守指引 III.15","q":"根據<註冊中介人操守要求指引>，在銷售及推銷註冊計劃及／或成分基金前，_______應對此等註冊計劃及／ 或成分基金進行_______，應持續地每隔一段合適時間進行，以確保其附屬中介人須清楚瞭解計劃運作事宜。","qi":[],"o":["主事中介人；培訓","主事中介人；產品查證","附屬中介人；培訓","負責人；產品查證"],"a":1},{"id":"7-172","ch":7,"ref":"操守指引 III.18","q":"何謂「需要特別照顧的客戶」？","qi":[],"o":["教育水平較低，小學程度或以下的人士","有視障或有其他障礙而令其獨立作出有關重要決定的能力受到影響的人士","60歲以上的人士","A及B皆為「需要特別照顧的客戶」"],"a":3},{"id":"7-173","ch":7,"ref":"操守指引 III.19/30","q":"根據<註冊中介人操守要求指引>，以下哪項需要錄音？","qi":["就客戶風險錯配的談話內容","於售後致電需特別照顧之客戶","於售後致電給客戶進行售後確認","向客戶披露所需資料"],"o":["I, II","I, III","II, III","III, IV"],"a":0},{"id":"7-174","ch":7,"ref":"操守指引 III.19(b)","q":"主事中介人如沒有錄音系統，便須與 _______ 訂立安排，由其中一方的獲授權人士，在售後致電該名客戶。","qi":[],"o":["熱線中心員工","前線監督","負責人員","核准受託人／保薦人／推銷商"],"a":3},{"id":"7-175","ch":7,"ref":"操守指引 III.19(b)","q":"根據<註冊中介人操守要求指引>,售後致電有需要特別照顧的客戶以進行確認的工作須由哪些人進行?","qi":[],"o":["進行銷售活動的附屬中介人","負責見證有關銷售過程的另一名員工","主事中介人的附屬人員","獲主事中介人授權的人士"],"a":3},{"id":"7-176","ch":7,"ref":"操守指引 III.2","q":"根據<註冊中介人操守要求指引>註冊中介人不得明知或罔顧後果地就以下哪些事項作出失實或具誤導成分的陳述？","qi":["其他註冊中介人","與強積金計劃/成分基金的營運或分銷有關連的任何人士","任何強積金計劃","任何成分基金"],"o":["II, III","II, III, IV","I, II, III","以上各項"],"a":3},{"id":"7-177","ch":7,"ref":"操守指引 III.20","q":"為遵守註冊參考章節：<註冊中介人操守要求指引>，＿＿＿＿須遵守＿＿＿＿就管控、程序及操守標準所訂定的規定。","qi":[],"o":["附屬中介人，其主事中介人","註冊中介人，其前線監督","主事中介人，核准受託人","註冊中介人，其負責人員"],"a":0},{"id":"7-178","ch":7,"ref":"操守指引 III.24","q":"根據<註冊中介人操守要求指引>第III、24段〈(瞭解客戶)規則〉，註冊中介人須盡一切合理步驟，確定其客戶的身份（透過核對客戶的身份證明文件如身份證），及對客戶有基本認識（例如客戶的教育水平），此規則適用於下列哪類客戶？","qi":["僱主","僱員","自僱人士","個人帳戶持有人"],"o":["I, II, III","I, III, IV","II, III, IV","I, II, III, IV"],"a":3},{"id":"7-179","ch":7,"ref":"操守指引 III.25","q":"下列哪些情況下，註冊中介人無須在下列情況下與客戶進行「適合性評估」？","qi":[],"o":["把累算權益由註冊計劃內的某一特定成分基金轉移至另一特定成分基金","把未來的供款(強制性或自願性供款)投資於某一特定成分 基金","把累算權益由一個註冊計劃轉移至另一個註冊計劃及投資於 該註冊計劃內的某一特定成分基金","講解各／單一基金的內容，包括其投資目標、費用及收費"],"a":3},{"id":"7-180","ch":7,"ref":"操守指引 III.29","q":"根據<註冊中介人操守要求指引>風險錯配指以下情況： 客戶在進行適合性評估後：","qi":[],"o":["在同一帳戶投資於多個風險水平不同的成分基金","投資於多個風險水平與經註冊中介人評估的客戶風險狀況不同的成分基金","堅持投資於一個風險水平與經註冊中介人評估的客戶風險狀況不同的成分基金","堅持投資於風險水平高於經註冊中介人評估的客戶風險狀況的成分基金"],"a":3},{"id":"7-181","ch":7,"ref":"操守指引 III.3","q":"根據<註冊中介人操守要求指引>，註冊中介人在進行多項規管活動時，其行事須誠實、公平、符合客戶的最佳利益及持正。舉例來說，註冊中介人須：","qi":["確保在由客戶簽署的任何表格上填妥所有要項，才要求客戶簽署表格","在合理可行範圍內盡快把已填妥的表格的副本交予客戶","已填妥的表格的副本須交予主事中介人保存最少三年","以電子形式儲存所有由客戶填寫及簽署的表格，而該等紀錄須讓前線監督易於取覽"],"o":["I, II","I, II, III","I, II, IV","上述各項"],"a":0},{"id":"7-182","ch":7,"ref":"操守指引 III.48/49","q":"根據註冊中介人操守要求指引，註冊中介人在邀請特定客戶考慮從保證基金轉出累算權益時，須：","qi":["就有關銷售過程進行錄音","建議客戶先查閱原來計劃的要約文件或向其核准受託人查詢詳情後，才從保證基金轉出累算權益","警告客戶從保證基金轉出累算權 const L = ['A', 'B', 'C', 'D'];
const ROM = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];
const CH = {
  1: { name: '強制性公積金制度簡介', short: '制度簡介', w: '1%', n: 1 },
  2: { name: '規管架構', short: '規管架構', w: '6%', n: 4 },
  3: { name: '強積金制度的主要特點', short: '主要特點', w: '45%', n: 36 },
  4: { name: '強積金受託人', short: '受託人', w: '5%', n: 4 },
  5: { name: '強積金計劃及投資', short: '計劃及投資', w: '19%', n: 15 },
  6: { name: '職業退休計劃與強積金制度的銜接安排', short: '職業退休銜接', w: '4%', n: 4 },
  7: { name: '強積金中介人（含《註冊中介人操守要求指引》）', short: '強積金中介人', w: '20%', n: 16 }
};
const CH_IDS = [1, 2, 3, 4, 5, 6, 7];
const EXAM_TOTAL = CH_IDS.reduce((s, c) => s + CH[c].n, 0);   /* 80 */
const EXAM_MIN = 120;                                         /* 2 小時 */
const passOf = n => Math.ceil(n * 7 / 10);                    /* 70% */
/* 儲存鍵名與卷二（iiqe-p2-…）不同，同一網站下兩份試卷的記錄互不影響 */
const KEY = 'iiqe-p4-mpf-mock-v1';
const HKEY = 'iiqe-p4-mpf-mock-hist-v1';
const BYID = {};
POOL.forEach(q => { BYID[q.id] = q; });

/* ====== 練習記錄（做過、做錯的題）====== */
function loadH() {
  try {
    const raw = localStorage.getItem(HKEY);
    if (raw) {
      const h = JSON.parse(raw);
      if (h && typeof h === 'object') return { seen: h.seen || {}, exams: Array.isArray(h.exams) ? h.exams : [] };
    }
  } catch (e) { /* 瀏覽器不允許儲存時照常運作 */ }
  return { seen: {}, exams: [] };
}
let H = loadH();
function saveH() { try { localStorage.setItem(HKEY, JSON.stringify(H)); } catch (e) { /* ignore */ } }

const wasWrong = q => { const s = H.seen[q.id]; return !!s && s[2] === 0; };
const wrongPool = () => POOL.filter(wasWrong);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 抽題：新試卷按各章比重抽題（1/4/36/4/15/4/16），優先抽未做過的題，其次是曾經做錯的題；錯題重練只抽曾經做錯的題 */
function drawPaper(mode) {
  let picks = [];
  if (mode === 'wrong') {
    picks = shuffle(wrongPool()).slice(0, EXAM_TOTAL);
  } else {
    CH_IDS.forEach(c => {
      const g = [[], [], []];
      POOL.filter(q => q.ch === c).forEach(q => {
        const s = H.seen[q.id];
        g[!s ? 0 : (s[2] === 0 ? 1 : 2)].push(q);
      });
      picks = picks.concat(shuffle([].concat(shuffle(g[0]), shuffle(g[1]), shuffle(g[2])).slice(0, CH[c].n)));
    });
  }
  picks.sort((a, b) => a.ch - b.ch);
  return picks.map(q => q.id);
}

/* ====== 作答狀態 ====== */
const blank = () => ({
  phase: 'idle', mode: 'new', paper: [], answers: [], flags: [],
  pos: 0, startedAt: 0, deadline: 0, limitMs: 0, submittedAt: 0, auto: false
});

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.paper) || !Array.isArray(s.answers)) return null;
    if (['idle', 'exam', 'done'].indexOf(s.phase) < 0) return null;
    if (s.phase !== 'idle') {
      if (!s.paper.length || s.answers.length !== s.paper.length) return null;
      if (!s.paper.every(id => BYID[id])) return null;
    }
    if (!Array.isArray(s.flags) || s.flags.length !== s.paper.length) s.flags = Array(s.paper.length).fill(false);
    if (!(s.pos >= 0 && s.pos < Math.max(1, s.paper.length))) s.pos = 0;
    if (!s.limitMs) s.limitMs = EXAM_MIN * 60 * 1000;
    return s;
  } catch (e) { return null; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

let S = load() || blank();
let QUESTIONS = [], TOTAL = 0, PASS = 0;
function applyPaper() {
  QUESTIONS = S.paper.map(id => BYID[id]).filter(Boolean);
  TOTAL = QUESTIONS.length;
  PASS = passOf(TOTAL);
  QUESTIONS.forEach(q => { q._ch = q.ch; q._head = '第 ' + q.ch + ' 章 ' + CH[q.ch].short; });
}
applyPaper();

const ui = { screen: S.phase === 'done' ? 'result' : 'start', filter: 'all', sheetOpen: false, stampAnim: false, warned: false };
let timerId = null;
let modalResolve = null;

const $ = (sel, root) => (root || document).querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const answeredCount = () => S.answers.filter(a => a !== null).length;
const isCorrect = i => S.answers[i] === QUESTIONS[i].a;
const allIdx = () => QUESTIONS.map((_, i) => i);
const wrongList = () => allIdx().filter(i => !isCorrect(i));
const chIdx = c => allIdx().filter(i => QUESTIONS[i]._ch === c);
const pad = n => String(n).padStart(2, '0');
const fmt = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(t / 60)) + ':' + pad(t % 60); };
const fmtLong = ms => { const t = Math.max(0, Math.round(ms / 1000)); return Math.floor(t / 60) + ' 分 ' + (t % 60) + ' 秒'; };
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function announce(msg) {
  const el = $('#live');
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 40);
}

/* 答案所指的陳述（只限「I, II, III」類選項）：回顧時列出正確答案包含哪些陳述 */
function stmtIdxFor(q) {
  if (!q.qi || !q.qi.length) return [];
  const o = q.o[q.a];
  const idx = [];
  o.split(/[^A-Za-z]+/).filter(Boolean).forEach(t => {
    const k = ROM.indexOf(t);
    if (k >= 0 && k < q.qi.length && idx.indexOf(k) < 0) idx.push(k);
  });
  if (idx.length) return idx.sort((a, b) => a - b);
  if (/全部|以上(?:所有|各項|皆)|所有各項/.test(o)) return q.qi.map((_, k) => k);
  return [];
}

/* ====== 畫面 ====== */
function render() {
  renderTop();
  const view = $('#view');
  if (ui.screen === 'start') view.innerHTML = startHTML();
  else if (ui.screen === 'result') view.innerHTML = resultHTML();
  else view.innerHTML = examHTML();
  if (!ui.sheetOpen) { const s = $('#scrim'); if (s) s.remove(); }
  updateProgress();
  syncTimer();
}

function renderTop() {
  let right = '';
  if (ui.screen === 'exam') {
    right = `<span class="stat" id="stat">已答 ${answeredCount()} / ${TOTAL}</span>
      <span class="timer" id="timer" role="timer" aria-label="剩餘時間">剩餘 ${fmt(S.deadline - Date.now())}</span>
      <button type="button" class="btn primary" data-act="submit">提交試卷</button>`;
  } else if (ui.screen === 'review') {
    const wn = wrongList().length;
    right = `<div class="seg" role="group" aria-label="回顧範圍">
        <button type="button" data-act="filter" data-f="all" aria-pressed="${ui.filter === 'all'}">全部</button>
        <button type="button" data-act="filter" data-f="wrong" aria-pressed="${ui.filter === 'wrong'}" ${wn ? '' : 'disabled'}>錯題 ${wn}</button>
      </div>
      <button type="button" class="btn" data-act="to-result">成績</button>`;

}

function updateProgress() {
  let pct = 0, label = '作答進度';
  if (ui.screen === 'exam') pct = TOTAL ? answeredCount() / TOTAL * 100 : 0;
  else if (ui.screen === 'review') { pct = (S.pos + 1) / TOTAL * 100; label = '回顧位置'; }
  else if (ui.screen === 'result') pct = 100;
  $('#bar').style.width = pct + '%';
  const p = $('#progress');
  p.setAttribute('aria-valuenow', String(Math.round(pct)));
  p.setAttribute('aria-label', label);
}

function startHTML() {
  const inProgress = S.phase === 'exam' && TOTAL > 0;
  const remain = S.deadline - Date.now();
  const seenAll = POOL.filter(q => H.seen[q.id]).length;
  const wn = wrongPool().length;

  }).join('');

  let actions;
  if (inProgress) {
    actions = `<button type="button" class="btn primary" data-act="resume">${remain > 0 ? '繼續作答' : '提交並查看成績'}</button>

  } else {
    actions = `<button type="button" class="btn primary" data-act="start" data-mode="new">開始新試卷</button>
      <button type="button" class="btn" data-act="start" data-mode="wrong" ${wn ? '' : 'disabled'}>錯題重練（${wn} 題）</button>

  }
  return `<section class="doc" aria-labelledby="doc-title">

    <p class="doc-sub">強積金中介人考試模擬練習。題目取自官方《強積金中介人考試模擬試題》，已剔除重複題；每份試卷按考試章節比重從題庫抽題，回顧時列出答案及手冊出處。</p>
    <dl class="schedule">
      <div><dt>題目</dt><dd>${EXAM_TOTAL} 題單項選擇題（A–D 四個選項），按各章比重從題庫抽題，優先抽未做過的題</dd></div>
      <div><dt>時限</dt><dd>${EXAM_MIN} 分鐘（2 小時），時間屆滿系統自動提交</dd></div>
      <div><dt>合格標準</dt><dd>答對 ${passOf(EXAM_TOTAL)} 題或以上（70%）</dd></div>
      <div><dt>題庫</dt><dd>${POOL.length} 題<span class="hint scope-hint">已練 ${seenAll} / ${POOL.length} 題</span></dd></div>
      <div><dt>章節比重</dt><dd><table class="weights"><thead><tr><th scope="col">章次</th><th scope="col">內容</th><th scope="col" class="num">比重</th><th scope="col" class="num">每卷題數</th><th scope="col" class="num">已練 / 題庫</th></tr></thead><tbody>${rows}</tbody></table></dd></div>
    </dl>
    <p class="notice"><b>留意制度更新</b>題目及答案依 2017 年 3 月第九版研習資料手冊。其後制度有改動，例如自 2025 年 5 月 1 日起，僱主強制性供款所產生的累算權益不能再抵銷由該日起服務年資的長期服務金／遣散費（手冊 3.13）。遇到與最新規則不同的題目，應試時以最新版手冊及考試機構公布為準。</p>
    <div class="actions">${actions}</div>
