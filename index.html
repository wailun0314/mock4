  </section>`;
}

function navList() {
  return (ui.screen === 'review' && ui.filter === 'wrong') ? wrongList() : allIdx();
}

function examHTML() {
  const review = ui.screen === 'review';
  const i = S.pos, q = QUESTIONS[i], a = S.answers[i];
  const items = (q.qi || []).map((t, k) =>
    `<li><span class="n">${ROM[k]}.</span><span>${esc(t)}</span></li>`).join('');

  const opts = q.o.map((o, k) => {
    const body = `<span><span class="sr-only">選項 ${L[k]}：</span>${esc(o)}</span>`;
    if (!review) {
      return `<button type="button" class="opt" data-act="pick" data-k="${k}" aria-pressed="${a === k}">
        <span class="bubble" aria-hidden="true">${L[k]}</span>${body}</button>`;
    }
    let cls = 'opt r', tag = '';
    if (k === q.a) { cls += ' ok'; tag = a === k ? '你答對了' : '正確答案'; }
    else if (a === k) { cls += ' bad'; tag = '你的答案'; }
    return `<div class="${cls}"><span class="bubble" aria-hidden="true">${L[k]}</span>${body}${tag ? `<span class="tag">${tag}</span>` : ''}</div>`;
  }).join('');

  let expl = '';
  if (review) {
    const verdict = a === null
      ? `<p class="verdict none">未作答，正確答案是 ${L[q.a]}</p>`
      : (a === q.a ? `<p class="verdict ok">答對了，答案是 ${L[q.a]}</p>`
                   : `<p class="verdict bad">答錯了：你選了 ${L[a]}，正確答案是 ${L[q.a]}</p>`);
    const sidx = stmtIdxFor(q);
    const stmtBlock = sidx.length
      ? `<h3>答案「${esc(q.o[q.a])}」所指的陳述</h3><ol class="stmts">${sidx.map(k => `<li><span class="n">${ROM[k]}.</span><span>${esc(q.qi[k])}</span></li>`).join('')}</ol>`
      : '';
    const ref = q.ref ? `<p class="ref"><b>出處</b><span>${esc(q.ref)}</span></p>` : '';
    expl = `<section class="exp" aria-label="解析">${verdict}${stmtBlock}${ref}</section>`;
  }

  const list = navList();
  const idx = list.indexOf(i);
  const hasPrev = idx > 0, hasNext = idx >= 0 && idx < list.length - 1;
  const nextBtn = (!review && !hasNext)
    ? `<button type="button" class="btn primary" data-act="submit">提交試卷</button>`
    : `<button type="button" class="btn${review ? '' : ' primary'}" data-act="next" ${hasNext ? '' : 'disabled'}>下一題</button>`;
  const posText = (review && ui.filter === 'wrong') ? `錯題 ${idx + 1} / ${list.length}` : `第 ${i + 1} / ${TOTAL} 題`;
  const flag = review ? '' : `<button type="button" class="flag" data-act="flag" aria-pressed="${S.flags[i]}">${S.flags[i] ? '已標記' : '標記此題'}</button>`;

  return `<div class="layout">
    <article class="sheet" aria-labelledby="qno">
      <div class="q-head">
        <div class="q-id">
          <h2 class="q-no" id="qno" tabindex="-1">第 ${i + 1} 題<span>/ ${TOTAL}</span></h2>
          <p class="q-meta"><span>${esc(q._head)}</span>${review && q.ref ? `<span class="topic">${esc(q.ref)}</span>` : ''}</p>
        </div>
        ${flag}
      </div>
      <p class="stem">${esc(q.q)}</p>
      ${items ? `<ol class="stmts">${items}</ol>` : ''}
      <div class="opts" role="group" aria-label="選項">${opts}</div>
      ${expl}
      <nav class="pager" aria-label="題目導覽">
        <button type="button" class="btn" data-act="prev" ${hasPrev ? '' : 'disabled'}>上一題</button>
        <span class="grow"></span>
        <span class="pos">${posText}</span>
        <button type="button" class="btn sheet-btn" data-act="sheet" aria-expanded="${ui.sheetOpen}" aria-controls="omr">答題卡</button>
        <span class="grow"></span>
        ${nextBtn}
      </nav>
    </article>
    ${omrHTML()}
  </div>`;
}

function omrHTML() {
  const review = ui.screen === 'review';
  const groups = CH_IDS.map(c => {
    const idxs = chIdx(c);
    if (!idxs.length) return '';
    const cells = idxs.map(i => {
      let cls = 'cell', st;
      if (review) {
        const s = S.answers[i] === null ? 'skip' : (isCorrect(i) ? 'ok' : 'bad');
        cls += ' ' + s;
        if (ui.filter === 'wrong' && isCorrect(i)) cls += ' dim';
        st = s === 'skip' ? '未作答' : (s === 'ok' ? '答對' : '答錯');
      } else {
        if (S.answers[i] !== null) cls += ' done';
        if (S.flags[i]) cls += ' flagged';
        st = (S.answers[i] !== null ? '已作答' : '未作答') + (S.flags[i] ? '，已標記' : '');
      }
      if (i === S.pos) cls += ' cur';
      return `<button type="button" class="${cls}" data-act="goto" data-i="${i}" aria-label="第 ${i + 1} 題，${st}"${i === S.pos ? ' aria-current="true"' : ''}>${i + 1}</button>`;
    }).join('');
    const range = idxs.length > 1 ? `第 ${idxs[0] + 1}–${idxs[idxs.length - 1] + 1} 題` : `第 ${idxs[0] + 1} 題`;
    return `<div class="omr-group"><div class="omr-label"><span>第 ${c} 章 ${esc(CH[c].short)}</span><span>${range}</span></div><div class="omr-grid">${cells}</div></div>`;
  }).join('');
  const legend = review
    ? `<span><i class="ok"></i>答對</span><span><i class="bad"></i>答錯</span><span><i class="skip"></i>未作答</span>`
    : `<span><i class="done"></i>已作答</span><span><i></i>未作答</span><span><i class="fl"></i>已標記</span>`;
  const count = review ? `答對 ${TOTAL - wrongList().length} / ${TOTAL}` : `已答 ${answeredCount()} / ${TOTAL}`;
  return `<aside class="omr${ui.sheetOpen ? ' open' : ''}" id="omr" aria-label="答題卡">
    <div class="omr-head">答題卡<span>${count}</span><button type="button" class="omr-close" data-act="sheet-close">關閉</button></div>
    <div class="omr-body">${groups}<div class="legend">${legend}</div></div>
  </aside>`;
}

function resultHTML() {
  const correct = allIdx().filter(isCorrect).length;
  const pass = correct >= PASS;
  const pct = TOTAL ? Math.round(correct / TOTAL * 100) : 0;
  const unanswered = S.answers.filter(x => x === null).length;
  const end = S.submittedAt || Date.now();
  const used = Math.min(S.limitMs, Math.max(0, end - S.startedAt));
  const d = new Date(end);
  const dateStr = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  const rows = CH_IDS.map(c => {
    const idxs = chIdx(c);
    if (!idxs.length) return '';
    const ok = idxs.filter(isCorrect).length;
    const p = Math.round(ok / idxs.length * 100);
    return `<tr><th scope="row">第 ${c} 章 ${esc(CH[c].name)}<small>考試比重 ${CH[c].w}</small></th><td class="num">${ok} / ${idxs.length}</td><td class="barcell"><span class="bar"><i style="width:${p}%"></i></span></td><td class="num">${p}%</td></tr>`;
  }).join('');
  const wn = TOTAL - correct;
  const wp = wrongPool().length;
  const seenAll = POOL.filter(q => H.seen[q.id]).length;
  const modeNote = S.mode === 'wrong' ? '（錯題重練）' : '';
  return `<section class="doc" aria-labelledby="res-title">
    <div class="result-top">
      <div class="stamp ${pass ? 'pass' : 'fail'}${ui.stampAnim && !reduceMotion() ? ' animate' : ''}" aria-hidden="true"><span class="s-main">${pass ? '合格' : '不合格'}</span><span class="s-date">${dateStr}</span></div>
      <div>
        <h1 class="res-title" id="res-title" tabindex="-1">${pass ? '成績達到合格水平' : '成績未達合格水平'}${modeNote}</h1>
        <p class="score">${correct}<small>/ ${TOTAL}</small></p>
        <p class="score-line">正確率 ${pct}%，合格線為 ${PASS} 題（70%）${unanswered ? `；未作答 ${unanswered} 題` : ''}。用時 ${fmtLong(used)}。</p>
        ${S.auto ? '<p class="note">作答時間已屆滿，系統已自動提交試卷。</p>' : ''}
      </div>
    </div>
    <table class="breakdown"><caption>各章表現</caption>
      <thead><tr><th scope="col">章節</th><th scope="col" class="num">答對</th><th scope="col"><span class="sr-only">比例</span></th><th scope="col" class="num">正確率</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="actions">
      <button type="button" class="btn primary" data-act="review-wrong" ${wn ? '' : 'disabled'}>回顧錯題（${wn}）</button>
      <button type="button" class="btn" data-act="review-all">回顧全部 ${TOTAL} 題</button>
      <span class="grow"></span>
      <button type="button" class="btn quiet" data-act="retake">返回首頁</button>
    </div>
    <p class="fine">回顧模式以綠色標示正確答案、紅色標示你答錯的選項，並列出答案所指的陳述及手冊出處（官方題庫沒有逐題解析）。題庫進度：已練 ${seenAll} / ${POOL.length} 題，錯題本共 ${wp} 題，可在首頁按「錯題重練」再做。</p>
  </section>`;
}

/* ====== 操作 ====== */
function focusQuestion() {
  const h = $('#qno');
  if (h) h.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
}

function startExam(mode) {
  const ids = drawPaper(mode);
  if (!ids.length) return;
  S = blank();
  S.mode = mode;
  S.paper = ids;
  S.answers = Array(ids.length).fill(null);
  S.flags = Array(ids.length).fill(false);
  S.phase = 'exam';
  S.startedAt = Date.now();
  S.limitMs = Math.round(ids.length * EXAM_MIN / EXAM_TOTAL * 60 * 1000);
  S.deadline = S.startedAt + S.limitMs;
  applyPaper();
  ui.screen = 'exam'; ui.filter = 'all'; ui.sheetOpen = false; ui.warned = false;
  save(); render(); focusQuestion();
}

function resumeExam() {
  if (Date.now() >= S.deadline) { submit(true); return; }
  ui.screen = 'exam'; ui.sheetOpen = false;
  render(); focusQuestion();
}

function pick(k) {
  if (ui.screen !== 'exam' || S.phase !== 'exam') return;
  S.answers[S.pos] = k;
  save(); render();
  announce(`第 ${S.pos + 1} 題已選 ${L[k]}`);
  const b = $(`.opt[data-k="${k}"]`);
  if (b) b.focus({ preventScroll: true });
}

function step(d) {
  const list = navList();
  const idx = list.indexOf(S.pos);
  const n = idx + d;
  if (idx < 0 || n < 0 || n >= list.length) return;
  S.pos = list[n];
  save(); render(); focusQuestion();
}

function gotoQ(i) {
  if (ui.screen === 'review' && ui.filter === 'wrong' && isCorrect(i)) ui.filter = 'all';
  S.pos = i;
  ui.sheetOpen = false;
  save(); render(); focusQuestion();
}

function setSheet(open) {
  ui.sheetOpen = open;
  const omr = $('#omr');
  if (!omr) return;
  omr.classList.toggle('open', open);
  let scrim = $('#scrim');
  if (open && !scrim) {
    scrim = document.createElement('div');
    scrim.id = 'scrim'; scrim.className = 'scrim'; scrim.setAttribute('data-act', 'sheet-close');
    document.body.appendChild(scrim);
  }
  if (!open && scrim) scrim.remove();
  const btn = $('[data-act="sheet"]');
  if (btn) btn.setAttribute('aria-expanded', String(open));
  if (open) { const c = $('.cell.cur'); if (c) setTimeout(() => c.focus({ preventScroll: true }), 60); }
  else if (btn) btn.focus({ preventScroll: true });
}

function setFilter(f) {
  if (f === 'wrong') {
    const w = wrongList();
    if (!w.length) return;
    ui.filter = 'wrong';
    if (isCorrect(S.pos)) S.pos = w[0];
  } else {
    ui.filter = 'all';
  }
  save(); render(); focusQuestion();
}

function askSubmit() {
  const n = answeredCount(), un = TOTAL - n, fl = S.flags.filter(Boolean).length;
  let body = `已作答 ${n} / ${TOTAL} 題。`;
  if (un) body += `尚有 ${un} 題未作答，提交後當作答錯。`;
  if (fl) body += `另有 ${fl} 題已標記待覆查。`;
  body += '提交後不能再修改答案。';
  confirmBox({ title: '提交試卷？', body, ok: '確認提交', cancel: '繼續作答' })
    .then(yes => { if (yes) submit(false); });
}

function recordResult() {
  QUESTIONS.forEach((q, i) => {
    const s = H.seen[q.id] || [0, 0, 1];
    if (S.answers[i] === q.a) { s[0]++; s[2] = 1; } else { s[1]++; s[2] = 0; }
    H.seen[q.id] = s;
  });
  H.exams.push({ t: S.submittedAt, score: allIdx().filter(isCorrect).length, total: TOTAL, mode: S.mode });
  if (H.exams.length > 100) H.exams = H.exams.slice(-100);
  saveH();
}

function submit(auto) {
  if (S.phase !== 'exam') return;
  closeModal();
  S.phase = 'done';
  S.submittedAt = Math.min(Date.now(), S.deadline);
  S.auto = !!auto;
  recordResult();
  ui.screen = 'result'; ui.sheetOpen = false; ui.stampAnim = true;
  save(); render();
  ui.stampAnim = false;
  const h = $('#res-title');
  if (h) h.focus({ preventScroll: true });
  window.scrollTo(0, 0);
  if (auto) announce('作答時間已屆滿，系統已自動提交試卷');
}

function syncTimer() {
  if (ui.screen === 'exam' && S.phase === 'exam') {
    if (!timerId) timerId = setInterval(tick, 1000);
    tick();
  } else if (timerId) {
    clearInterval(timerId); timerId = null;
  }
}

function tick() {
  const left = S.deadline - Date.now();
  if (left <= 0) { submit(true); return; }
  const el = $('#timer');
  if (el) {
    el.textContent = '剩餘 ' + fmt(left);
    el.classList.toggle('low', left <= 5 * 60 * 1000);
  }
  if (left <= 5 * 60 * 1000 && !ui.warned) { ui.warned = true; announce('剩餘時間不足 5 分鐘'); }
}

/* ====== 對話框 ====== */
function confirmBox(o) {
  closeModal();
  const root = $('#modal-root');
  const prev = document.activeElement;
  root.innerHTML = `<div class="modal-scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" aria-describedby="m-body">
    <h2 id="m-title">${esc(o.title)}</h2><p id="m-body">${esc(o.body)}</p>
    <div class="actions"><button type="button" class="btn" data-m="no">${esc(o.cancel)}</button><button type="button" class="btn primary" data-m="yes">${esc(o.ok)}</button></div>
  </div></div>`;
  return new Promise(resolve => {
    modalResolve = v => {
      root.innerHTML = ''; root.onclick = null; modalResolve = null;
      if (prev && prev.focus && document.contains(prev)) prev.focus({ preventScroll: true });
      resolve(v);
    };
    root.onclick = e => {
      const b = e.target.closest('[data-m]');
      if (b) { modalResolve(b.getAttribute('data-m') === 'yes'); return; }
      if (e.target.classList.contains('modal-scrim')) modalResolve(false);
    };
    const first = $('[data-m="no"]', root);
    if (first) first.focus();
  });
}
function closeModal() { if (modalResolve) modalResolve(false); }

/* ====== 事件 ====== */
document.addEventListener('click', e => {
  if (e.target.closest('#modal-root')) return;
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const act = t.getAttribute('data-act');
  switch (act) {
    case 'start': startExam(t.getAttribute('data-mode') === 'wrong' ? 'wrong' : 'new'); break;
    case 'resume': resumeExam(); break;
    case 'restart':
      confirmBox({ title: '放棄目前作答？', body: '已作答的答案及計時會被清除，並立即開始一份新的試卷。', ok: '重新開始', cancel: '取消' })
        .then(yes => { if (yes) startExam(S.mode === 'wrong' ? 'wrong' : 'new'); });
      break;
    case 'pick': pick(+t.getAttribute('data-k')); break;
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'goto': gotoQ(+t.getAttribute('data-i')); break;
    case 'flag':
      S.flags[S.pos] = !S.flags[S.pos];
      save(); render();
      announce(S.flags[S.pos] ? '已標記此題' : '已取消標記');
      { const f = $('.flag'); if (f) f.focus({ preventScroll: true }); }
      break;
    case 'sheet': setSheet(!ui.sheetOpen); break;
    case 'sheet-close': setSheet(false); break;
    case 'submit': askSubmit(); break;
    case 'filter': setFilter(t.getAttribute('data-f')); break;
    case 'to-result':
      ui.screen = 'result'; ui.sheetOpen = false; render();
      { const h = $('#res-title'); if (h) h.focus({ preventScroll: true }); }
      window.scrollTo(0, 0);
      break;
    case 'review-all':
      ui.screen = 'review'; ui.filter = 'all'; S.pos = 0;
      save(); render(); focusQuestion();
      break;
    case 'review-wrong': {
      const w = wrongList();
      if (!w.length) return;
      ui.screen = 'review'; ui.filter = 'wrong'; S.pos = w[0];
      save(); render(); focusQuestion();
      break;
    }
    case 'retake':
      confirmBox({ title: '返回首頁？', body: '本次試卷的答案與解析回顧會被清除。成績及錯題記錄已保存，可在首頁用「錯題重練」再做。', ok: '返回首頁', cancel: '取消' })
        .then(yes => { if (yes) { S = blank(); applyPaper(); save(); ui.screen = 'start'; render(); window.scrollTo(0, 0); } });
      break;
  }
});

document.addEventListener('keydown', e => {
  if (modalResolve) {
    if (e.key === 'Escape') { e.preventDefault(); modalResolve(false); }
    else if (e.key === 'Tab') {
      const bs = Array.from(document.querySelectorAll('#modal-root button'));
      const cur = bs.indexOf(document.activeElement);
      e.preventDefault();
      bs[(cur + (e.shiftKey ? -1 : 1) + bs.length) % bs.length].focus();
    }
    return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (ui.screen !== 'exam' && ui.screen !== 'review') return;
  if (e.key === 'Escape' && ui.sheetOpen) { e.preventDefault(); setSheet(false); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); return; }
  if (ui.screen === 'exam' && e.key && e.key.length === 1) {
    const k = 'abcd'.indexOf(e.key.toLowerCase());
    const n = '1234'.indexOf(e.key);
    const idx = k >= 0 ? k : n;
    if (idx >= 0) { e.preventDefault(); pick(idx); }
  }
});

render();
})();
</script>
</body>
